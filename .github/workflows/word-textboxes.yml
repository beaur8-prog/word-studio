name: Word paragraph and textbox compatibility
on:
  workflow_dispatch:
    inputs:
      public_docx_validation_payload:
        description: 'Optional one/two public reproduction copies as JSON [{base64,sha256}]; never submit private documents'
        type: string
        default: ''
  push:
    branches: ['codex/word-web-critical-four-hours', 'codex/word-contextual-spacing', 'codex/word-list-pagination', 'codex/word-long-body-metrics', 'codex/word-list-line-boxes', 'codex/word-numbering-fonts', 'codex/word-content-pagination-six-hours', 'codex/word-pagination-three-hours', 'codex/hwp-format-three-hours', 'codex/hwp-cd-ten-hours']
    paths:
      - '.github/workflows/word-textboxes.yml'
      - 'src/**'
      - 'tests/docx-textboxes.spec.ts'
      - 'tests/docx-heading-default-marks.spec.ts'
      - 'tests/paragraph-contextual-spacing.spec.ts'
      - 'tests/list-pagination.spec.ts'
      - 'tests/word-list-lines.spec.ts'
      - 'tests/word-list-symbols.spec.ts'
      - 'tests/docx-grouped-pictures.spec.ts'
      - 'tests/helpers/grouped-drawing.ts'
      - 'tests/docx-content-visibility.spec.ts'
      - 'tests/docx-table-style-paragraphs.spec.ts'
      - 'tests/docx-floating-size.spec.ts'
      - 'tests/layout-flow.spec.ts'
      - 'tests/word-font-fallbacks.spec.ts'
      - 'tests/korean-font-fallbacks.spec.ts'
      - 'tests/preview-page-status.spec.ts'
      - 'tests/editor-visible-pages.spec.ts'
      - 'tests/docx-merge-continuation.spec.ts'
      - 'tests/hwp-fixed-spaces.spec.ts'
      - 'tests/hwp-fixed-spaces-fixture.cjs'
      - 'tests/hwp-fixed-spaces.test.cjs'
      - 'tests/hwp-change-tracking.spec.ts'
      - 'tests/hwp-layout-metadata.test.cjs'
      - 'tests/hwp-metafile-preview.test.cjs'
      - 'tests/hwp-metafile-crop.spec.ts'
      - 'tests/hwp-metafile-fixture.cjs'
      - 'tests/hwp-crop.spec.ts'
      - 'tests/hwp-crop-fixture.cjs'
      - 'tests/selection-navigation.spec.ts'
      - 'tests/word-short-paragraphs.spec.ts'
      - 'tests/word-row-split-defaults.spec.ts'
      - 'tests/word-paragraph-keeps.spec.ts'
      - 'tests/symbol-fonts.test.cjs'
      - 'tests/word-line-metrics.spec.ts'
      - 'tests/word-line-metrics-capacity.spec.ts'
      - 'scripts/word-openxml-validator/**'
      - 'scripts/prepare-word-schema-inputs.cjs'
  pull_request:
    paths:
      - '.github/workflows/word-textboxes.yml'
      - 'src/word-contextual-spacing.ts'
      - 'src/word-list-labels.ts'
      - 'src/word-list-layout.ts'
      - 'src/word-list-marker.ts'
      - 'src/document-symbols.ts'
      - 'src/word-numbering.ts'
      - 'src/word-font-fallbacks.ts'
      - 'src/selection-navigation.ts'
      - 'src/editor-paragraph-pagination.ts'
      - 'src/paragraph-fragments.ts'
      - 'src/word-line-metrics.ts'
      - 'src/main.tsx'
      - 'src/assets/fonts/**'
      - 'src/list-fragments.ts'
      - 'src/pagination.ts'
      - 'src/editor-lines.ts'
      - 'src/word-heading-defaults.ts'
      - 'src/docx-format.ts'
      - 'src/docx-metadata.ts'
      - 'src/imported-format.ts'
      - 'src/docx-drawing-groups.ts'
      - 'src/drawing-group.ts'
      - 'src/drawing-group-anchor.ts'
      - 'src/docx-textboxes.ts'
      - 'src/textbox-frame.ts'
      - 'src/docx-stories.ts'
      - 'src/document-io.ts'
      - 'src/document-html.ts'
      - 'src/extensions.ts'
      - 'src/floating-layout.ts'
      - 'src/print-layout.ts'
      - 'src/styles.css'
      - 'src/korean-font-fallbacks.css'
      - 'src/editor-visible-pages.ts'
      - 'tests/docx-textboxes.spec.ts'
      - 'tests/docx-heading-default-marks.spec.ts'
      - 'tests/paragraph-contextual-spacing.spec.ts'
      - 'tests/list-pagination.spec.ts'
      - 'tests/word-list-lines.spec.ts'
      - 'tests/word-list-symbols.spec.ts'
      - 'tests/docx-grouped-pictures.spec.ts'
      - 'tests/helpers/grouped-drawing.ts'
      - 'tests/docx-content-visibility.spec.ts'
      - 'tests/docx-table-style-paragraphs.spec.ts'
      - 'tests/docx-floating-size.spec.ts'
      - 'tests/layout-flow.spec.ts'
      - 'tests/word-font-fallbacks.spec.ts'
      - 'tests/korean-font-fallbacks.spec.ts'
      - 'tests/preview-page-status.spec.ts'
      - 'tests/editor-visible-pages.spec.ts'
      - 'tests/docx-merge-continuation.spec.ts'
      - 'tests/hwp-fixed-spaces.spec.ts'
      - 'tests/hwp-fixed-spaces-fixture.cjs'
      - 'tests/hwp-fixed-spaces.test.cjs'
      - 'tests/hwp-change-tracking.spec.ts'
      - 'tests/hwp-layout-metadata.test.cjs'
      - 'tests/hwp-metafile-preview.test.cjs'
      - 'tests/hwp-metafile-crop.spec.ts'
      - 'tests/hwp-metafile-fixture.cjs'
      - 'tests/hwp-crop.spec.ts'
      - 'tests/hwp-crop-fixture.cjs'
      - 'tests/selection-navigation.spec.ts'
      - 'tests/word-short-paragraphs.spec.ts'
      - 'tests/word-row-split-defaults.spec.ts'
      - 'tests/word-paragraph-keeps.spec.ts'
      - 'tests/symbol-fonts.test.cjs'
      - 'tests/word-line-metrics.spec.ts'
      - 'tests/word-line-metrics-capacity.spec.ts'
      - 'scripts/word-openxml-validator/**'
      - 'scripts/prepare-word-schema-inputs.cjs'
permissions:
  contents: read
jobs:
  textbox-layout-and-schema:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify bundled font bytes, licenses and legacy symbol coverage
        run: node --test tests/symbol-fonts.test.cjs tests/hwp-fixed-spaces.test.cjs tests/hwp-layout-metadata.test.cjs tests/hwp-metafile-preview.test.cjs
      - name: Exercise stories, colors, geometry, editor commands and two real DOCX exports
        run: npx playwright test tests/docx-textboxes.spec.ts tests/paragraph-contextual-spacing.spec.ts tests/docx-heading-default-marks.spec.ts tests/list-pagination.spec.ts tests/word-list-lines.spec.ts tests/word-list-symbols.spec.ts tests/docx-content-visibility.spec.ts tests/docx-grouped-pictures.spec.ts tests/docx-table-style-paragraphs.spec.ts tests/docx-floating-size.spec.ts tests/layout-flow.spec.ts tests/word-font-fallbacks.spec.ts tests/korean-font-fallbacks.spec.ts tests/preview-page-status.spec.ts tests/editor-visible-pages.spec.ts tests/docx-merge-continuation.spec.ts tests/hwp-fixed-spaces.spec.ts tests/selection-navigation.spec.ts tests/word-short-paragraphs.spec.ts tests/word-row-split-defaults.spec.ts tests/word-paragraph-keeps.spec.ts tests/word-line-metrics.spec.ts tests/word-line-metrics-capacity.spec.ts tests/hwp-change-tracking.spec.ts tests/hwp-metafile-crop.spec.ts tests/hwp-crop.spec.ts --trace=off --reporter=line
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Repeat asynchronous list typography after edits and late font loading
        run: npx playwright test tests/word-list-lines.spec.ts --grep "imported marker height follows edits" --repeat-each=3 --trace=off --output=test-results/list-metric-repeats --reporter=line
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Add optional public reproduction copies for schema validation
        id: public-copies
        run: node scripts/prepare-word-schema-inputs.cjs
      - name: Validate exported DOCX files with the official OpenXML SDK
        run: dotnet run --project scripts/word-openxml-validator/Validator.csproj --configuration Release -- test-results ${{ steps.public-copies.outputs.expected }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-textbox-${{ matrix.os }}
          path: test-results/
          retention-days: 3
