      - 'tests/table-cell-focus.spec.ts'
      - 'tests/word-short-paragraphs.spec.ts'
      - 'tests/word-widow-splits.spec.ts'
      - 'tests/docx-page-background.spec.ts'
      - 'tests/docx-outline-level.spec.ts'
      - 'tests/docx-checkboxes.spec.ts'
      - 'tests/word-row-split-defaults.spec.ts'
      - 'tests/word-paragraph-keeps.spec.ts'
      - 'tests/symbol-fonts.test.cjs'
      - 'tests/word-line-metrics.spec.ts'
      - 'tests/word-line-metrics-capacity.spec.ts'
      - 'scripts/word-openxml-validator/**'
      - 'scripts/prepare-word-schema-inputs.cjs'
permissions:
  contents: read
jobs:
  textbox-layout-and-schema:
    if: ${{ !inputs.native_font_metrics_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify bundled font bytes, licenses and legacy symbol coverage
        run: node --test tests/symbol-fonts.test.cjs tests/hwp-fixed-spaces.test.cjs tests/hwp-layout-metadata.test.cjs tests/hwp-metafile-preview.test.cjs
      - name: Exercise stories, colors, geometry, editor commands and two real DOCX exports
        run: npx playwright test tests/docx-textboxes.spec.ts tests/docx-unspecified-font-size.spec.ts tests/word-furniture-empty-lines.spec.ts tests/word-bookmark-line-height.spec.ts tests/empty-heading-flow.spec.ts tests/docx-auto-hyphenation.spec.ts tests/word-table-autofit.spec.ts tests/paragraph-contextual-spacing.spec.ts tests/docx-heading-default-marks.spec.ts tests/list-pagination.spec.ts tests/word-list-lines.spec.ts tests/word-list-symbols.spec.ts tests/docx-content-visibility.spec.ts tests/docx-grouped-pictures.spec.ts tests/docx-table-style-paragraphs.spec.ts tests/docx-floating-size.spec.ts tests/layout-flow.spec.ts tests/word-font-fallbacks.spec.ts tests/korean-font-fallbacks.spec.ts tests/preview-page-status.spec.ts tests/editor-visible-pages.spec.ts tests/docx-merge-continuation.spec.ts tests/hwp-fixed-spaces.spec.ts tests/selection-navigation.spec.ts tests/table-cell-focus.spec.ts tests/word-short-paragraphs.spec.ts tests/word-widow-splits.spec.ts tests/docx-page-background.spec.ts tests/docx-outline-level.spec.ts tests/docx-checkboxes.spec.ts tests/word-row-split-defaults.spec.ts tests/word-paragraph-keeps.spec.ts tests/word-line-metrics.spec.ts tests/word-line-metrics-capacity.spec.ts tests/hwp-change-tracking.spec.ts tests/hwp-metafile-crop.spec.ts tests/hwp-metafile-gdi.spec.ts tests/hwp-crop.spec.ts tests/export-layout-suspension.spec.ts tests/docx-control-tabs.spec.ts tests/docx-bookmark-ranges.spec.ts tests/hwp-navigation.spec.ts tests/offpage-floating.spec.ts tests/hwp-cell-profile-capacity.spec.ts --trace=off --reporter=line
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Repeat asynchronous list typography after edits and late font loading
        run: npx playwright test tests/word-list-lines.spec.ts --grep "imported marker height follows edits" --repeat-each=3 --trace=off --output=test-results/list-metric-repeats --reporter=line
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Add optional public reproduction copies for schema validation
        id: public-copies
        run: node scripts/prepare-word-schema-inputs.cjs
      - name: Validate exported DOCX files with the official OpenXML SDK
        run: dotnet run --project scripts/word-openxml-validator/Validator.csproj --configuration Release -- test-results ${{ steps.public-copies.outputs.expected }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-textbox-${{ matrix.os }}
          path: test-results/
          retention-days: 3

  windows-font-metrics:
    if: ${{ inputs.native_font_metrics_only }}
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Measure matching fallback overrides in actual Chromium
        shell: pwsh
        run: |
          node analysis/word-docx-local-8h-2026-11-15/tools/measure-fallback-browser.cjs | Set-Content -Encoding utf8 browser-word-font-metrics.json
          if ($LASTEXITCODE) { throw 'Browser font measurement failed' }
          $report = Get-Content browser-word-font-metrics.json -Raw | ConvertFrom-Json
          if ($report.rows.Count -ne 72) { throw 'Expected four faces, nine sizes and two DPR controls' }
      - name: Compile local diagnostic with the installed Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $studio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $studio) { throw 'Visual C++ compiler unavailable' }
          @"
          @echo off
          call "$studio\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 analysis\word-docx-local-8h-2026-11-15\tools\measure-word-font.cpp /Fe:word-font-metrics.exe /link dwrite.lib
          "@ | Set-Content -Encoding ascii build-font-metrics.bat
          & cmd.exe /d /c build-font-metrics.bat
          if ($LASTEXITCODE) { throw 'Diagnostic compilation failed' }
      - name: Measure only bundled licensed fallback fonts
        shell: pwsh
        run: |
          & .\word-font-metrics.exe src/assets/fonts | Set-Content -Encoding utf8 native-word-font-metrics.json
          if ($LASTEXITCODE) { throw 'Font metric measurement failed' }
          $report = Get-Content native-word-font-metrics.json -Raw | ConvertFrom-Json
          if ($report.fonts.Count -ne 4) { throw 'Expected four font faces' }
          foreach ($font in $report.fonts) { if ($font.measurements.Count -ne 72) { throw 'Missing size/DPI/mode controls' } }
      - uses: actions/upload-artifact@v4
        with:
          name: native-word-font-metrics
          path: |
            native-word-font-metrics.json
            browser-word-font-metrics.json
          retention-days: 3
