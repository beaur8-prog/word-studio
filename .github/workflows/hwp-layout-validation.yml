name: HWP layout validation
on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Retry Windows validation after unchanged product passes Linux'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/hwp-layout-validation.yml'
      - 'src/hwp/**'
      - 'src/hwp-cell-*.ts'
      - 'src/hwp-body-*.ts'
      - 'src/editor-merged-fragments.ts'
      - 'src/paragraph-fragments.ts'
      - 'src/table-fragments.ts'
      - 'src/docx-hwp-cell-line.ts'
      - 'src/*pagination.ts'
      - 'src/editor-lines.ts'
      - 'src/page-empty-lines.ts'
      - 'src/column-layout.ts'
      - 'src/document-tabs.ts'
      - 'src/styles.css'
      - 'src/print-layout.ts'
      - 'src/paragraph-fit.ts'
      - 'src/table-anchor.ts'
      - 'src/table-anchor-data.ts'
      - 'src/table-format.ts'
      - 'src/document-io.ts'
      - 'src/docx-metadata.ts'
      - 'src/docx-format.ts'
      - 'src/imported-format.ts'
      - 'src/document-html.ts'
      - 'src/docx-table-cell.ts'
      - 'tests/hwp-*'
      - 'tests/paragraph-flow.spec.ts'
      - 'tests/paragraph-fit.spec.ts'
      - 'tests/paragraph-blank-breaks.spec.ts'
      - 'tests/official-sample-regressions.spec.ts'
      - 'scripts/verify-cell-pdf-order.py'
      - 'tests/exact-line-height.spec.ts'
      - 'tests/exact-line-boundary.spec.ts'
      - 'tests/merged-cell*.spec.ts'
      - 'tests/column-page-breaks.spec.ts'
      - 'tests/column-table-borders.spec.ts'
      - 'tests/repeating-header-boundary.spec.ts'
      - 'tests/borderless-tables.spec.ts'
      - 'tests/section-table-boundary.spec.ts'
      - 'tests/docx-bookmark-names.spec.ts'
      - 'tests/docx-floating-size.spec.ts'
      - 'tests/footnote-flow.spec.ts'
permissions:
  contents: read
jobs:
  windows-layout:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare PDF text verification
        run: python -m pip install --disable-pip-version-check --quiet pypdf==6.10.0
      # Recycle Chromium after the long cell matrix. A single Windows browser
      # previously exhausted network buffers and could not load App.tsx.
      - name: Test native terminal cell matrix in a separate browser
        run: npx playwright test tests/hwp-cell-terminal.spec.ts --output=test-results/terminal-matrix --reporter=line
        env:
          HWP_LAYOUT_DIAGNOSTICS: '1'
      - name: Test font metrics, paragraph pagination and inline tables
        run: npx playwright test tests/paragraph-flow.spec.ts tests/paragraph-fit.spec.ts tests/paragraph-blank-breaks.spec.ts tests/official-sample-regressions.spec.ts tests/exact-line-height.spec.ts tests/footnote-flow.spec.ts tests/hwp-textflow.spec.ts tests/hwp-inline-tables.spec.ts tests/hwp-inline-tail.spec.ts tests/hwp-cell-paragraphs.spec.ts tests/hwp-merge-row-break.spec.ts tests/hwp-paragraph-table.spec.ts tests/hwp-empty-lines.spec.ts tests/hwp-cell-colors.spec.ts tests/hwp-row-flow.spec.ts tests/exact-line-boundary.spec.ts tests/table-anchor.spec.ts tests/hwp-navigation.spec.ts tests/hwp-nested-grid.spec.ts tests/hwp-nested-height.spec.ts tests/hwp-cell-reflow.spec.ts tests/hwp-cell-style.spec.ts tests/hwp-cell-rules.spec.ts tests/merged-cell-flow.spec.ts tests/merged-cell-reserve.spec.ts tests/table-spacing.spec.ts tests/column-page-breaks.spec.ts tests/column-table-borders.spec.ts tests/repeating-header-boundary.spec.ts tests/borderless-tables.spec.ts tests/hwp-nested-borders.spec.ts tests/hwp-hard-breaks.spec.ts tests/hwp-word-wrap.spec.ts tests/section-table-boundary.spec.ts tests/docx-bookmark-names.spec.ts tests/docx-floating-size.spec.ts tests/hwp-shapes.spec.ts tests/hwp-crop.spec.ts tests/hwp-floating-export.spec.ts tests/hwp-floating-cells.spec.ts tests/hwp-page-budget.spec.ts tests/hwp-script-fonts.spec.ts --output=test-results/general --reporter=line
        env:
          HWP_LAYOUT_DIAGNOSTICS: '1'
      - name: Verify cell PDF text order
        run: python scripts/verify-cell-pdf-order.py test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-layout-evidence
          path: test-results/
  linux-navigation:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare PDF text verification
        run: python -m pip install --disable-pip-version-check --quiet pypdf==6.10.0
      - name: Prepare Linux browser and fonts
        run: bash scripts/prepare-linux-ci.sh browser
      - name: Test navigation and page boundaries
        run: npx playwright test tests/paragraph-fit.spec.ts tests/paragraph-blank-breaks.spec.ts tests/official-sample-regressions.spec.ts tests/exact-line-height.spec.ts tests/hwp-merge-row-break.spec.ts tests/hwp-paragraph-table.spec.ts tests/hwp-empty-lines.spec.ts tests/hwp-cell-colors.spec.ts tests/hwp-row-flow.spec.ts tests/exact-line-boundary.spec.ts tests/table-anchor.spec.ts tests/merged-cell-reserve.spec.ts tests/hwp-navigation.spec.ts tests/hwp-nested-grid.spec.ts tests/hwp-nested-height.spec.ts tests/hwp-cell-reflow.spec.ts tests/hwp-cell-terminal.spec.ts tests/hwp-cell-style.spec.ts tests/hwp-cell-rules.spec.ts tests/word-use-cases.spec.ts tests/column-page-breaks.spec.ts tests/editor-page-boundaries.spec.ts tests/column-table-borders.spec.ts tests/repeating-header-boundary.spec.ts tests/borderless-tables.spec.ts tests/hwp-nested-borders.spec.ts tests/hwp-hard-breaks.spec.ts tests/hwp-word-wrap.spec.ts tests/section-table-boundary.spec.ts tests/docx-bookmark-names.spec.ts tests/docx-floating-size.spec.ts tests/hwp-shapes.spec.ts tests/hwp-crop.spec.ts tests/hwp-floating-export.spec.ts tests/hwp-floating-cells.spec.ts tests/hwp-page-budget.spec.ts tests/hwp-script-fonts.spec.ts --reporter=line
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Verify cell PDF text order
        run: python scripts/verify-cell-pdf-order.py test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-navigation-evidence
          path: test-results/
