name: HWP layout validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hwp-layout-validation.yml'
      - 'src/hwp/**'
      - 'src/*pagination.ts'
      - 'src/editor-lines.ts'
      - 'src/page-empty-lines.ts'
      - 'src/column-layout.ts'
      - 'src/document-tabs.ts'
      - 'src/styles.css'
      - 'src/print-layout.ts'
      - 'src/paragraph-fit.ts'
      - 'src/table-anchor.ts'
      - 'src/table-format.ts'
      - 'src/document-io.ts'
      - 'src/docx-metadata.ts'
      - 'tests/hwp-*'
      - 'tests/paragraph-flow.spec.ts'
      - 'tests/paragraph-fit.spec.ts'
      - 'tests/exact-line-height.spec.ts'
      - 'tests/exact-line-boundary.spec.ts'
      - 'tests/merged-cell*.spec.ts'
      - 'tests/column-page-breaks.spec.ts'
      - 'tests/column-table-borders.spec.ts'
      - 'tests/repeating-header-boundary.spec.ts'
      - 'tests/borderless-tables.spec.ts'
      - 'tests/footnote-flow.spec.ts'
permissions:
  contents: read
jobs:
  windows-layout:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test font metrics, paragraph pagination and inline tables
        run: npx playwright test tests/paragraph-flow.spec.ts tests/paragraph-fit.spec.ts tests/exact-line-height.spec.ts tests/footnote-flow.spec.ts tests/hwp-textflow.spec.ts tests/hwp-inline-tables.spec.ts tests/hwp-inline-tail.spec.ts tests/hwp-cell-paragraphs.spec.ts tests/hwp-merge-row-break.spec.ts tests/hwp-paragraph-table.spec.ts tests/hwp-empty-lines.spec.ts tests/hwp-cell-colors.spec.ts tests/hwp-row-flow.spec.ts tests/exact-line-boundary.spec.ts tests/table-anchor.spec.ts tests/hwp-navigation.spec.ts tests/hwp-nested-grid.spec.ts tests/merged-cell-flow.spec.ts tests/merged-cell-reserve.spec.ts tests/table-spacing.spec.ts tests/column-page-breaks.spec.ts tests/column-table-borders.spec.ts tests/repeating-header-boundary.spec.ts tests/borderless-tables.spec.ts tests/hwp-nested-borders.spec.ts --reporter=line
        env:
          HWP_LAYOUT_DIAGNOSTICS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-layout-evidence
          path: test-results/
  linux-navigation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Linux browser and fonts
        run: bash scripts/prepare-linux-ci.sh browser
      - name: Test navigation and page boundaries
        run: npx playwright test tests/paragraph-fit.spec.ts tests/exact-line-height.spec.ts tests/hwp-merge-row-break.spec.ts tests/hwp-paragraph-table.spec.ts tests/hwp-empty-lines.spec.ts tests/hwp-cell-colors.spec.ts tests/hwp-row-flow.spec.ts tests/exact-line-boundary.spec.ts tests/table-anchor.spec.ts tests/merged-cell-reserve.spec.ts tests/hwp-navigation.spec.ts tests/hwp-nested-grid.spec.ts tests/word-use-cases.spec.ts tests/column-page-breaks.spec.ts tests/editor-page-boundaries.spec.ts tests/column-table-borders.spec.ts tests/repeating-header-boundary.spec.ts tests/borderless-tables.spec.ts tests/hwp-nested-borders.spec.ts --reporter=line
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-navigation-evidence
          path: test-results/
