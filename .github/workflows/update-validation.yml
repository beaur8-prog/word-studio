name: Update controls validation
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build and verify the Windows Setup installer
        type: boolean
        default: false
      installer_only:
        description: Run Windows packaging and native upgrade scenarios after unchanged UI tests pass
        type: boolean
        default: false
  push:
    branches: ['codex/update-controls', 'codex/windows-updater-handoff', 'codex/macos-file-panels', 'codex/windows-installer-language', 'codex/windows-update-in-place']
  pull_request:
    paths:
      - 'electron-builder.config.cjs'
      - 'scripts/test-windows-installer*.ps1'
      - 'scripts/test-windows-update-in-place.ps1'
      - 'electron/windows-installer.nsh'
      - 'electron/studio-updat*'
      - 'electron/preload.cjs'
      - 'electron/main.cjs'
      - 'src/UpdateCenter.tsx'
      - 'src/App.tsx'
      - 'src/recovery.ts'
      - 'tests/startup.spec.ts'
      - 'tests/native-file-panels.spec.ts'
      - 'tests/native-file-dialogs.test.cjs'
      - 'electron/native-file-dialogs.cjs'
      - 'src/hwp/HwpReader.tsx'
      - 'src/hwp/reader.css'
      - 'tests/hwp-reader.spec.ts'
      - 'tests/updates*'
      - 'tests/updates/**'
      - 'scripts/update-desktop-smoke.cjs'
      - 'scripts/test-windows-updater-handoff.cjs'
      - '.github/workflows/update-validation.yml'
permissions:
  contents: read
jobs:
  updates:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.installer_only && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-22.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned Electron runtime for desktop tests
        run: node node_modules/electron/install.js
      - name: Prepare Linux desktop and browser
        if: runner.os == 'Linux'
        run: bash scripts/prepare-linux-ci.sh browser
      - run: npm run build
      - run: npm run test:updates
      - run: npm run test:native
      - name: Browser update and document preservation scenarios (Linux)
        if: runner.os == 'Linux' && !inputs.installer_only
        run: npx playwright test tests/startup.spec.ts tests/editor.spec.ts tests/table-row-resize.spec.ts tests/word-use-cases.spec.ts tests/hwp-reader.spec.ts tests/updates.spec.ts tests/document-lifecycle.spec.ts tests/file-associations.spec.ts tests/native-file-panels.spec.ts --reporter=line
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - name: Browser update and document preservation scenarios (Windows)
        if: runner.os == 'Windows' && !inputs.installer_only
        run: npx playwright test tests/startup.spec.ts tests/editor.spec.ts tests/table-row-resize.spec.ts tests/word-use-cases.spec.ts tests/hwp-reader.spec.ts tests/updates.spec.ts tests/document-lifecycle.spec.ts tests/file-associations.spec.ts tests/native-file-panels.spec.ts --reporter=line
      - name: Real Electron update bridge (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:updates:desktop
      - name: Real Electron update bridge (Windows)
        if: runner.os == 'Windows'
        run: npm run test:updates:desktop
      - name: Parse Windows update helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'electron/studio-update-windows.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Build Windows Setup
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/codex/windows-updater-handoff' || github.ref == 'refs/heads/codex/windows-installer-language' || github.ref == 'refs/heads/codex/windows-update-in-place' || inputs.build_windows)
        run: npm run package:win
      - name: Build forced-language positive control
        if: runner.os == 'Windows' && github.ref == 'refs/heads/codex/windows-installer-language'
        run: npx electron-builder --config electron-builder.config.cjs --prepackaged "release/windows/Word Studio" --win nsis --x64 --publish never --config.nsis.displayLanguageSelector=true --config.directories.output=release/language-control
      - name: Reproduce forced language selector in positive control
        if: runner.os == 'Windows' && github.ref == 'refs/heads/codex/windows-installer-language'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./scripts/test-windows-installer-language.ps1 -Setup "release/language-control/Word-Studio-$version-windows-x64-setup.exe" -Stage control -ExpectLanguageSelector
      - name: Native Windows helper acknowledgement, install, relaunch and cancellation
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/codex/windows-updater-handoff' || github.ref == 'refs/heads/codex/windows-installer-language' || github.ref == 'refs/heads/codex/windows-update-in-place' || inputs.build_windows)
        run: node scripts/test-windows-updater-handoff.cjs
      - name: Fetch published Setup and helper for real upgrade scenarios
        if: runner.os == 'Windows' && github.ref == 'refs/heads/codex/windows-update-in-place'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.4.12 --pattern 'Word-Studio-1.4.12-windows-x64-setup.exe' --dir .cache/legacy-update
          if ($LASTEXITCODE) { throw 'Legacy installer download failed.' }
          git fetch origin refs/tags/v1.4.12:refs/tags/v1.4.12 --depth=1
          git show v1.4.12:electron/studio-update-windows.ps1 | Set-Content .cache/legacy-update/helper-1.4.12.ps1 -Encoding utf8BOM
      - name: Actual Setup and helper keep user scope, custom directory and one app
        if: runner.os == 'Windows' && github.ref == 'refs/heads/codex/windows-update-in-place'
        shell: pwsh
        run: ./scripts/test-windows-update-in-place.ps1
      - name: Verify Setup installation, document preservation, reinstall and uninstall
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/codex/windows-updater-handoff' || github.ref == 'refs/heads/codex/windows-installer-language' || github.ref == 'refs/heads/codex/windows-update-in-place' || inputs.build_windows)
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Retain verified Windows installer
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/codex/windows-updater-handoff' || github.ref == 'refs/heads/codex/windows-installer-language' || github.ref == 'refs/heads/codex/windows-update-in-place' || inputs.build_windows)
        uses: actions/upload-artifact@v4
        with:
          name: word-studio-windows-release
          path: |
            release/installer/Word-Studio-*-windows-x64-setup.exe
            release/windows/BUILD-win-x64.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-controls-${{ runner.os }}
          include-hidden-files: true
          path: |
            .cache/update-desktop-*/result.json
            .cache/update-desktop-*/*.png
            .cache/installer-test.json
            .cache/installer-language-*
            .cache/update-in-place*
            .cache/desktop-smoke-*/result.json
            .cache/hwp-native-*/result.json
            .cache/hwp-editing-native-*/result.json
            test-results/
