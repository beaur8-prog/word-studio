name: Windows regression QA
run-name: Pair math preview equations and physical output on identical Windows input and display scales
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  math-paired:
    name: Same-runner Windows math geometry / before and after
    runs-on: windows-latest
    timeout-minutes: 36
    env:
      WINDOWS_CAPTURE_PRINT_IMAGE_IDENTITY: '1'
      WINDOWS_MATH_EQUATIONS: '1'
      WINDOWS_CHECK_STABLE_EDITOR_PAGES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Record six packaged app print previews, PDF files and settled editor pages
        shell: pwsh
        run: |
          $versions = [ordered]@{ before='27a35890240d7bbf47f06fd961682eb94f89fc3d'; after='c52784078cc2ab47e0864c96000a28e3006b0948' }
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/math-paired-input" --ids 08-math-exam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/math-paired-input/inventory.json"
          foreach ($version in $versions.GetEnumerator()) {
            git restore --source $version.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $version.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $package = "$env:RUNNER_TEMP/package-$($version.Key)"
            Move-Item release/windows $package
            $env:WORD_STUDIO_EXECUTABLE = "$package/Word Studio/Word Studio.exe"
            $measure = "$env:RUNNER_TEMP/math-$($version.Key)"
            New-Item -ItemType Directory $measure | Out-Null
            foreach ($density in @('1','1.25','1.5')) {
              Write-Host "WINDOWS_MATH_PAIR_INPUT $($version.Key) $density"
              $env:WINDOWS_FORCE_DEVICE_SCALE = $density
              $env:WINDOWS_NATIVE_PRINT_GEOMETRY = "$measure/geometry-$density.json"
              $env:WINDOWS_NATIVE_PDF_COPY = "$measure/sheet-$density.pdf"
              $env:WINDOWS_MATH_EQUATIONS_RESULT = "$measure/equations-$density.json"
              node scripts/windows-qa/native-export-pdf-stages.cjs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            node scripts/windows-qa/math-equation-density.cjs $measure
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($density in @('1.25','1.5')) {
              node scripts/windows-qa/compare-print-geometry.cjs "$measure/geometry-1.json" "$measure/geometry-$density.json" "$($version.Key)-$density"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Compare the real PDF pixels on the same Windows physical paper
        shell: powershell
        run: |
          foreach ($density in @('1','1.25','1.5')) {
            Write-Host "WINDOWS_MATH_PAIRED_PDF $density"
            scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/math-before/sheet-$density.pdf" -Candidate "$env:RUNNER_TEMP/math-after/sheet-$density.pdf" -ExpectedPages 20 -ReportOnly -MeasureDelta
          }
