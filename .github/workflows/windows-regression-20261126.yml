name: Windows regression QA
run-name: Verify saved Windows Hangul at 150 and 200 percent display scaling
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native-hwp:
    name: Scaled native round trips / ${{ matrix.id }} / ${{ matrix.scale }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: hwp-3, id: 06-mixed-document, scale: '1.5'}
          - {group: hwp-1, id: 07-english-exam, scale: '2'}
          - {group: hwp-2, id: 08-math-exam, scale: '2'}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_FORCE_DEVICE_SCALE: ${{ matrix.scale }}
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_MEASURE_PACKAGED_PAGE_BOUNDARIES: '1'
      WINDOWS_NATIVE_HWP_REVIEW_MS: '540000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Run the file-menu export and reopen both native outputs
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/final-native" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/final-native/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          $env:WINDOWS_NATIVE_DOCX_DIR = "$env:RUNNER_TEMP/native-docx"
          if ((git rev-parse 'HEAD:src') -ne '7dce0645084f50855723dd2bfbe44460dddc3570') { throw 'Unexpected product tree' }
          $inventory = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          if ($env:QA_ID -eq '07-english-exam') {
            $env:WINDOWS_CHECK_NATIVE_NBSPACE = '1'
            $env:WINDOWS_CHECK_HWP_MIXED_ADVANCE = '1'
          }
          node scripts/windows-qa/native-export-pdf-stages.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/word-openxml-validator -- $env:WINDOWS_NATIVE_DOCX_DIR 2 *> "$env:RUNNER_TEMP/native-sdk.log"
          $status = $LASTEXITCODE
          Write-Host "WINDOWS_FINAL_SDK Hangul $($env:QA_ID) count 2 exit $status"
          exit $status
