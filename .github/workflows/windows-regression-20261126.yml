name: Windows regression QA
run-name: Windows measured HWP line and print image witnesses
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  witness:
    name: Windows layout witnesses / ${{ matrix.source }}
    runs-on: windows-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        source: [before-responsive-preview, current]
    env:
      PLAYWRIGHT_CHANNEL: chromium
      QA_SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the exact initial or current product files
        shell: pwsh
        run: |
          if ($env:QA_SOURCE -eq 'before-responsive-preview') {
            git restore --source 19892d86e3599cbf2e735c40bdb23bd967242a5d -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code 19892d86e3599cbf2e735c40bdb23bd967242a5d -- src electron vendor package.json package-lock.json
            exit $LASTEXITCODE
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test -- tests/windows-qa/render-witnesses.spec.ts --workers=1 --trace=off
