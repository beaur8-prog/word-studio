name: Windows regression QA
run-name: Windows 163-page native PDF with row checkpoints A-B
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  paired-native:
    runs-on: windows-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build both precise Windows products
        shell: pwsh
        run: |
          npm run package:win:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item release/windows "$env:RUNNER_TEMP/hold-candidate"
          git restore --source b149de40a55f7f166bf249ba7287c21fe5d47bd2 -- src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code b149de40a55f7f166bf249ba7287c21fe5d47bd2 -- src electron vendor package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:win:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item release/windows "$env:RUNNER_TEMP/hold-before"
      - name: Run both on the same byte-verified input and Windows runner
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/hold-inputs" --ids 02-work-rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/hold-inputs/inventory.json"
          $statuses = @()
          foreach ($name in @('before', 'candidate')) {
            Write-Host "WINDOWS_NATIVE_HOLD_PRODUCT $name"
            $env:WORD_STUDIO_EXECUTABLE = "$env:RUNNER_TEMP/hold-$name/Word Studio/Word Studio.exe"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            $statuses += $LASTEXITCODE
          }
          if ($statuses -contains 1) { exit 1 }
  preview-browser:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test -- tests/desktop-print-coordination.spec.ts tests/export-layout-suspension.spec.ts tests/print-image-extent.spec.ts tests/hwp-sections.spec.ts --workers=1 --trace=off
