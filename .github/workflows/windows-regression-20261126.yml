name: Windows regression QA
run-name: Verify the exact authored 02 Work Rules table cut in both Windows formats
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native:
    name: Packaged Windows inline pictures / ${{ matrix.format }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        format: [hwp, hwpx]
    env:
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_FORMATS: ${{ matrix.format }}
      WINDOWS_NATIVE_HWP_TRACE: '1'
      WINDOWS_NATIVE_HWP_REVIEW_MS: '420000'
      WINDOWS_NATIVE_LARGE_HANGUL: '1'
      WINDOWS_NATIVE_LARGE_TEXT: '1'
      WINDOWS_NATIVE_PICTURE_PAINT: '1'
      WINDOWS_NATIVE_PICTURE_OFFSET: '168.08'
      WINDOWS_NATIVE_OVERHANG_READBACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Prepare the source-pinned large file and start the native export
        shell: pwsh
        run: |
          $product = 'HEAD'
          git restore --source $product --staged --worktree -- src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $product -- src electron vendor package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build -- --sourcemap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-win.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/large-native" --ids 02-work-rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/large-native/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = "$pwd/release/windows/Word Studio/Word Studio.exe"
          node scripts/windows-qa/native-export-pdf-stages.cjs
          exit $LASTEXITCODE
