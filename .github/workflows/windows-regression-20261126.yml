name: Windows regression QA
run-name: Measure physical Windows line ascent and preceding clearance for the one-sheet form
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  layout:
    name: Windows diagnostic / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: hwp-2, id: 05-return-form, format: hwpx }
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_DIAGNOSTIC_FORMAT: ${{ matrix.format }}
      PLAYWRIGHT_CHANNEL: chromium
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_HANCOM_FIXED_AGREEMENT: '1'
      WINDOWS_HANCOM_EARLY_BREAKS: '1'
      WINDOWS_REQUIRE_REOPEN: '1'
      WINDOWS_NATIVE_SKIP_PRINT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Find when the regression first appears
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/original" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/original/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $saved = @(Get-ChildItem test-results -Recurse -Filter 'hancom-saved.hwpx')
          $source = @(Get-ChildItem "$env:RUNNER_TEMP/original" -Filter '*.hwp')
          if ($saved.Count -ne 1 -or $source.Count -ne 1) { throw 'Expected exact in-memory diagnostic inputs' }
          node scripts/windows-qa/hancom-return-form-proof.cjs $source[0].FullName $saved[0].FullName
          exit $LASTEXITCODE
