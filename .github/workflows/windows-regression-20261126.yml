name: Windows regression QA
run-name: Windows full desktop regression and interruptible font probes A-B
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  paired-native:
    runs-on: windows-latest
    timeout-minutes: 44
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build both precise Windows products
        shell: pwsh
        run: |
          npm run package:win:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item release/windows "$env:RUNNER_TEMP/hold-candidate"
          git restore --source 34ac621d4de8867280acd08984df49879a5f3331 -- src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code 34ac621d4de8867280acd08984df49879a5f3331 -- src electron vendor package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:win:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item release/windows "$env:RUNNER_TEMP/hold-before"
      - name: Run both on the same byte-verified input and Windows runner
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/hold-inputs" --ids 02-work-rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/hold-inputs/inventory.json"
          $statuses = @()
          foreach ($name in @('before', 'candidate')) {
            Write-Host "WINDOWS_NATIVE_HOLD_PRODUCT $name"
            $env:WORD_STUDIO_EXECUTABLE = "$env:RUNNER_TEMP/hold-$name/Word Studio/Word Studio.exe"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            $statuses += $LASTEXITCODE
          }
          if ($statuses -contains 1) { exit 1 }

  desktop:
    name: Windows desktop / ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      QA_GROUP: ${{ matrix.group }}
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run one disjoint shard of the complete desktop suite
        shell: pwsh
        run: |
          @'
          import { registerHooks } from 'node:module';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          const limits = pathToFileURL(resolve('electron/document-limits.json')).href;
          registerHooks({
            load(url, context, next) {
              if (url === limits && !context.importAttributes?.type)
                return next(url, { ...context, importAttributes: { ...context.importAttributes, type: 'json' } });
              return next(url, context);
            },
          });
          '@ | Set-Content -Encoding utf8 ci-document-limits.mjs
          $env:NODE_OPTIONS='--import=./ci-document-limits.mjs'
          $env:PLAYWRIGHT_JSON_OUTPUT_FILE=Join-Path $env:RUNNER_TEMP 'windows-full.json'
          $files = @(Get-ChildItem tests -Recurse -Filter '*.spec.ts' | Sort-Object FullName |
            Where-Object { $_.Name -notlike 'android-*' -and $_.Directory.Name -ne 'windows-qa' } |
            ForEach-Object { (Resolve-Path -Relative $_.FullName).Replace('\','/') -replace '^\./','' })
          node node_modules/@playwright/test/cli.js test @files "--shard=$env:QA_GROUP/8" --workers=1 --reporter=line,json --trace=off
          $status = $LASTEXITCODE
          if (-not (Test-Path $env:PLAYWRIGHT_JSON_OUTPUT_FILE)) { exit 1 }
          $stats = (Get-Content $env:PLAYWRIGHT_JSON_OUTPUT_FILE -Raw | ConvertFrom-Json).stats
          if (($stats.expected + $stats.unexpected + $stats.flaky) -eq 0) { throw 'No tests executed' }
          Write-Host "WINDOWS_FULL group $env:QA_GROUP passed $($stats.expected) failed $($stats.unexpected) skipped $($stats.skipped) flaky $($stats.flaky)"
          exit $status
