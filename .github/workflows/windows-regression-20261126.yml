name: Windows regression QA
run-name: Pair direct native Hangul exports for the same English exam bytes on Windows
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  english-native-pair:
    name: Direct English exam native output / ${{ matrix.format }}
    runs-on: windows-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        format: [hwp, hwpx]
    env:
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_FORMATS: ${{ matrix.format }}
      WINDOWS_CHECK_NATIVE_NBSPACE: '1'
      WINDOWS_MEASURE_PACKAGED_PAGE_BOUNDARIES: '1'
      WINDOWS_NATIVE_HWP_REVIEW_MS: '540000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Export and reopen with the same input and isolated test profiles
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-1 "$env:RUNNER_TEMP/english-native-pair" --ids 07-english-exam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/english-native-pair/inventory.json"
          $versions = [ordered]@{ control='27a35890240d7bbf47f06fd961682eb94f89fc3d'; candidate='c52784078cc2ab47e0864c96000a28e3006b0948' }
          foreach ($version in $versions.GetEnumerator()) {
            git restore --source $version.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $version.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $package = "$env:RUNNER_TEMP/native-$($version.Key)"
            Move-Item release/windows $package
            $env:WORD_STUDIO_EXECUTABLE = "$package/Word Studio/Word Studio.exe"
            $env:WINDOWS_PRODUCT = $version.Key
            Write-Host "WINDOWS_ENGLISH_DIRECT $($version.Key)"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
