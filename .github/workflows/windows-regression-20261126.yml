name: Windows regression QA
run-name: Compare the remaining six pinned HWP originals against the pre-change Windows product
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  layout:
    name: Windows fixed Hancom comparison / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: hwp-1, id: 01-employment-contract }
          - { group: hwp-3, id: 03-health-table }
          - { group: hwp-2, id: 05-return-form }
          - { group: hwp-1, id: 07-english-exam }
          - { group: hwp-3, id: 09-korean-exam }
          - { group: hwp-1, id: 10-lh-plan }
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      PLAYWRIGHT_CHANNEL: chromium
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_VERIFY_REVERSE_MEDIA: '1'
      WINDOWS_HANCOM_FIXED_AGREEMENT: '1'
      WINDOWS_REQUIRE_REOPEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Compare open, print, two saves, and both native rereads
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/original" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/original/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $baseline = '19892d86e3599cbf2e735c40bdb23bd967242a5d'
          foreach ($variant in @($baseline,'HEAD')) {
            Write-Host "WINDOWS_HANCOM_FIXED_PRODUCT $variant"
            git restore --source $variant --staged --worktree -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $variant -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $output = "test-results-$variant"
            npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $docs = @(Get-ChildItem $output -Recurse -Filter 'textbox-save-*.docx')
            if ($docs.Count -ne 2) { throw 'Expected two actual DOCX saves' }
            dotnet run --project scripts/word-openxml-validator -- $output 2 *> "$env:RUNNER_TEMP/sdk-$variant.log"
            $status = $LASTEXITCODE
            Write-Host "WINDOWS_PUBLIC_SDK $variant total $($docs.Count) exit $status"
            if ($status -ne 0) { exit $status }
          }
