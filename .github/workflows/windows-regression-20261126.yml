name: Windows regression QA
run-name: Measure real Windows 100 125 and 150 percent print layout
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  display:
    name: Windows display scale / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: word, id: 02-tables}
          - {group: word, id: 06-long-body}
          - {group: hwp-1, id: 04-language-plan}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Save a real PDF at each verified rendering density
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/display-input" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/display-input/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $env:WORD_STUDIO_EXECUTABLE = "$((Get-Location).Path)/release/windows/Word Studio/Word Studio.exe"
          foreach ($scale in @('1','1.25','1.5')) {
            $env:WINDOWS_FORCE_DEVICE_SCALE = $scale
            $env:WINDOWS_NATIVE_PRINT_GEOMETRY = "$env:RUNNER_TEMP/geometry-$scale.json"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($scale in @('1.25','1.5')) {
            node scripts/windows-qa/compare-print-geometry.cjs "$env:RUNNER_TEMP/geometry-1.json" "$env:RUNNER_TEMP/geometry-$scale.json" $scale
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  changing-display:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test -- tests/windows-qa/live-density.spec.ts --workers=1 --trace=off
  native-profile:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      WINDOWS_NATIVE_PRINT_PROFILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Attribute the longest renderer work on the large native export
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/profile-input" --ids 02-work-rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/profile-input/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = "$((Get-Location).Path)/release/windows/Word Studio/Word Studio.exe"
          node scripts/windows-qa/native-export-pdf-stages.cjs
          exit $LASTEXITCODE
