name: Windows regression QA
run-name: Verify the authored HWPX bottom reserve in the actual Windows app
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  paired:
    name: Actual Windows before and after on the same housing sample
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QA_GROUP: hwp-1
      QA_ID: 10-lh-plan
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_REVIEW_MS: '540000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Compare actual packaged HWP and HWPX on the same runner
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/paired-native" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/paired-native/inventory.json"
          $profiles = [ordered]@{ control='18f295a132ed3aab3af75af47a89fd63031adf25'; candidate='HEAD' }
          foreach ($product in $profiles.GetEnumerator()) {
            git restore --source $product.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $product.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item release/windows "$env:RUNNER_TEMP/paired-$($product.Key)"
            $env:WORD_STUDIO_EXECUTABLE = "$env:RUNNER_TEMP/paired-$($product.Key)/Word Studio/Word Studio.exe"
            $env:WINDOWS_NATIVE_DOCX_DIR = "$env:RUNNER_TEMP/paired-$($product.Key)-docx"
            $env:WINDOWS_NATIVE_HWP_COPY = "$env:RUNNER_TEMP/$($product.Key)"
            $env:WINDOWS_PRODUCT = $product.Key
            $env:WINDOWS_MEASURE_PACKAGED_PAGE_BOUNDARIES = '1'
            if ($product.Key -eq 'candidate') { $env:WINDOWS_EXPECT_NATIVE_PAGES = '8,8' }
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project scripts/word-openxml-validator -- $env:WINDOWS_NATIVE_DOCX_DIR 2 *> "$env:RUNNER_TEMP/$($product.Key)-sdk.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "WINDOWS_FINAL_SDK Hangul 10-lh-plan $($product.Key) count 2 exit 0"
          }
          foreach ($format in @('hwp','hwpx')) {
            Write-Host "WINDOWS_COMPARE_NATIVE_FORMAT $format"
            node scripts/windows-qa/compare-native-table-reserve.cjs "$env:RUNNER_TEMP/control.$format" "$env:RUNNER_TEMP/candidate.$format"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
