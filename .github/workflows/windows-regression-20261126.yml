name: Windows regression QA
run-name: Test reference-density line metrics on Windows with paired renderer builds
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  display:
    name: Windows display scale / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: word, id: 02-tables, pages: 7}
          - {group: word, id: 06-long-body, pages: 9}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      QA_PAGES: ${{ matrix.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Save a real PDF at each verified rendering density
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/display-input" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/display-input/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $versions = [ordered]@{control='375c8dd6e78d5dadac33b1ed50b9fe8e1717cdae';candidate='HEAD'}
          foreach ($version in $versions.GetEnumerator()) {
            git restore --source $version.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $version.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packaged = "$env:RUNNER_TEMP/density-app-$($version.Key)"
            Move-Item release/windows $packaged
            $env:WORD_STUDIO_EXECUTABLE = "$packaged/Word Studio/Word Studio.exe"
            foreach ($scale in @('1','1.25','1.5')) {
              Write-Host "WINDOWS_DENSITY_VERSION $($version.Key) $scale"
              $env:WINDOWS_FORCE_DEVICE_SCALE = $scale
              $env:WINDOWS_NATIVE_PDF_COPY = "$env:RUNNER_TEMP/studio-$($version.Key)-$scale.pdf"
              $env:WINDOWS_NATIVE_PRINT_GEOMETRY = "$env:RUNNER_TEMP/geometry-$($version.Key)-$scale.json"
              node scripts/windows-qa/native-export-pdf-stages.cjs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            foreach ($scale in @('1.25','1.5')) {
              Write-Host "WINDOWS_GEOMETRY_VERSION $($version.Key) $scale"
              node scripts/windows-qa/compare-print-geometry.cjs "$env:RUNNER_TEMP/geometry-control-1.json" "$env:RUNNER_TEMP/geometry-$($version.Key)-$scale.json" $scale
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Measure each saved PDF with the fixed Windows PDF renderer scale
        shell: powershell
        run: |
          scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/studio-control-1.pdf" -Candidate "$env:RUNNER_TEMP/studio-candidate-1.pdf" -ExpectedPages ([UInt32]$env:QA_PAGES)
          foreach ($version in @('control','candidate')) {
            foreach ($scale in @('1.25','1.5')) {
              Write-Host "WINDOWS_DENSITY_PDF_VERSION $version $scale"
              scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/studio-control-1.pdf" -Candidate "$env:RUNNER_TEMP/studio-$version-$scale.pdf" -ExpectedPages ([UInt32]$env:QA_PAGES) -ReportOnly
            }
          }
