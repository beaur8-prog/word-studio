name: Windows regression QA
run-name: Investigate cold Windows Word PDF repeatability at fixed display density
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: windows-latest
    timeout-minutes: 24
    env:
      WINDOWS_CAPTURE_PRINT_FACES: '1'
      WINDOWS_FORCE_DEVICE_SCALE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Write two actual PDFs from each fixed build and font environment
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py word "$env:RUNNER_TEMP/word-repeat" --ids 06-long-body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/word-repeat/inventory.json"
          $versions = [ordered]@{control='375c8dd6e78d5dadac33b1ed50b9fe8e1717cdae';candidate='dc1db016b1243ba8adc73eb27960770d88f24755'}
          foreach ($version in $versions.GetEnumerator()) {
            git restore --source $version.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $version.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $packaged = "$env:RUNNER_TEMP/repeat-app-$($version.Key)"
            Move-Item release/windows $packaged
            $env:WORD_STUDIO_EXECUTABLE = "$packaged/Word Studio/Word Studio.exe"
            foreach ($sample in @(1,2)) {
              Write-Host "WINDOWS_PDF_FIXED_INPUT $($version.Key) $sample"
              $env:WINDOWS_NATIVE_PDF_COPY = "$env:RUNNER_TEMP/studio-$($version.Key)-$sample.pdf"
              $env:WINDOWS_NATIVE_PRINT_GEOMETRY = "$env:RUNNER_TEMP/geometry-$($version.Key)-$sample.json"
              node scripts/windows-qa/native-export-pdf-stages.cjs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            node scripts/windows-qa/compare-print-geometry.cjs "$env:RUNNER_TEMP/geometry-$($version.Key)-1.json" "$env:RUNNER_TEMP/geometry-$($version.Key)-2.json" $version.Key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/windows-qa/compare-print-geometry.cjs "$env:RUNNER_TEMP/geometry-control-1.json" "$env:RUNNER_TEMP/geometry-candidate-1.json" paired
          exit $LASTEXITCODE
      - name: Separate same-build repeatability from the code comparison
        shell: powershell
        run: |
          foreach ($version in @('control','candidate')) {
            Write-Host "WINDOWS_PDF_REPEAT $version"
            scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/studio-$version-1.pdf" -Candidate "$env:RUNNER_TEMP/studio-$version-2.pdf" -ExpectedPages 9 -ReportOnly -MeasureDelta
          }
          Write-Host "WINDOWS_PDF_REPEAT paired"
          scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/studio-control-1.pdf" -Candidate "$env:RUNNER_TEMP/studio-candidate-1.pdf" -ExpectedPages 9 -ReportOnly -MeasureDelta
