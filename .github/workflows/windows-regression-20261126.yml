name: Windows regression QA
run-name: Isolate the second DOCX save from the large Hangul native output
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  large-export:
    name: Windows 163-page document / ${{ matrix.route }}
    runs-on: windows-latest
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix:
        route: [two-docx, direct-native]
    env:
      QA_ROUTE: ${{ matrix.route }}
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_REVIEW_MS: '540000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        if: matrix.route == 'two-docx'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Run the selected route in a fresh copy of the Windows app
        shell: pwsh
        run: |
          if ((git rev-parse 'HEAD:src') -ne 'f15f4cabb706a1555cae3e5704f0204521a3b624') { throw 'Unexpected product tree' }
          $caseDir = Join-Path $env:RUNNER_TEMP 'large-docx-stage'
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 $caseDir --ids 02-work-rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = Join-Path $caseDir 'inventory.json'
          $inventory = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          if ($env:QA_ROUTE -eq 'two-docx') {
            $env:WINDOWS_NATIVE_DOCX_DIR = Join-Path $caseDir 'docx'
            $env:WINDOWS_NATIVE_DOCX_SAVE_TRACE = '1'
          } else {
            $env:WINDOWS_NATIVE_HWP_SAVES = '1'
            $env:WINDOWS_NATIVE_PICTURE_PAINT = '1'
            $env:WINDOWS_PACKAGED_TABLE_FIT = '1'
            $env:WINDOWS_NATIVE_HWP_TRACE = '1'
            $env:WINDOWS_MEASURE_PACKAGED_PAGE_BOUNDARIES = '1'
          }
          node scripts/windows-qa/native-export-pdf-stages.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:QA_ROUTE -eq 'two-docx') {
            dotnet run --project scripts/word-openxml-validator -- $env:WINDOWS_NATIVE_DOCX_DIR 2 *> (Join-Path $caseDir 'sdk.log')
            $status = $LASTEXITCODE
            Write-Host "WINDOWS_FINAL_SDK large HWP count 2 exit $status"
            exit $status
          }
