name: Windows regression QA
run-name: Identify the precise empty paragraph metrics that shifted two Windows documents
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  layout:
    name: Windows diagnostic / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: hwp-3, id: 09-korean-exam, format: hwpx }
          - { group: hwp-1, id: 10-lh-plan, format: hwp }
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_DIAGNOSTIC_FORMAT: ${{ matrix.format }}
      PLAYWRIGHT_CHANNEL: chromium
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_HANCOM_FIXED_AGREEMENT: '1'
      WINDOWS_HANCOM_EARLY_BREAKS: '1'
      WINDOWS_REQUIRE_REOPEN: '1'
      WINDOWS_NATIVE_SKIP_PRINT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Find when the regression first appears
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/original" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/original/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $points = @('4288c66580e7090426c74c890f6b1fc8cc31ecac','6b8fad0a11d1444386dea7691b1be4fdca2e3700')
          foreach ($variant in $points) {
            Write-Host "WINDOWS_HANCOM_FIXED_PRODUCT $variant"
            git restore --source $variant --staged --worktree -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $variant -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off --output "test-results-$variant"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $before = @(Get-ChildItem "test-results-$($points[0])" -Recurse -Filter "hancom-saved.$env:WINDOWS_DIAGNOSTIC_FORMAT")
          $candidate = @(Get-ChildItem "test-results-$($points[1])" -Recurse -Filter "hancom-saved.$env:WINDOWS_DIAGNOSTIC_FORMAT")
          if ($before.Count -ne 1 -or $candidate.Count -ne 1) { throw 'Expected exactly one file per precise test' }
          node scripts/windows-qa/compare-empty-hwp-breaks.cjs $before[0].FullName $candidate[0].FullName
          exit $LASTEXITCODE
