name: Windows regression QA
run-name: Check real Windows output at 200 percent on the focused Word and HWP samples
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  high-dpi-print:
    name: Windows 200 percent / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: word, id: 02-tables}
          - {group: hwp-1, id: 07-english-exam}
          - {group: hwp-2, id: 08-math-exam}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_FORCE_DEVICE_SCALE: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Check the actual native menu PDF on the requested Windows scale
        shell: pwsh
        run: |
          if ((git rev-parse 'HEAD:src') -ne '7dce0645084f50855723dd2bfbe44460dddc3570') { throw 'Unexpected product tree' }
          $caseDir = Join-Path $env:RUNNER_TEMP 'windows-200-scale'
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP $caseDir --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = Join-Path $caseDir 'inventory.json'
          $inventory = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          $env:WINDOWS_NATIVE_PDF_COPY = Join-Path $caseDir 'output.pdf'
          if ($env:QA_ID -eq '07-english-exam') {
            $env:WINDOWS_NATIVE_PRINT_GEOMETRY = Join-Path $caseDir 'print-geometry.json'
            $env:WINDOWS_CAPTURE_HWP_BODY_LINES = '1'
          }
          if ($env:QA_ID -eq '08-math-exam') { $env:WINDOWS_CHECK_STABLE_EDITOR_PAGES = '1' }
          if ($env:QA_ID -eq '02-tables') { $env:WINDOWS_WORD_TABLE_WITNESS = '1' }
          node scripts/windows-qa/native-export-pdf-stages.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:QA_ID -eq '07-english-exam') {
            node scripts/windows-qa/compare-hwp-print-witness.cjs
            exit $LASTEXITCODE
          }
