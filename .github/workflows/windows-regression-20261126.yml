name: Windows regression QA
run-name: Verify the final large-document PDF speed with both run orders on Windows
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  final-pdf-pair:
    name: Windows final PDF / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: public-2, id: moel-harassment-manual, pages: 97}
          - {group: hwp-2, id: 02-work-rules, pages: 163}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      QA_PAGES: ${{ matrix.pages }}
      WINDOWS_FORCE_DEVICE_SCALE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build the exact control and product Windows applications
        shell: pwsh
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'windows-final-pdf'
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP $caseDir --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $inventory = @(Get-Content (Join-Path $caseDir 'inventory.json') -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          $versions = [ordered]@{ control='19892d86e3599cbf2e735c40bdb23bd967242a5d'; final='c52784078cc2ab47e0864c96000a28e3006b0948' }
          foreach ($entry in $versions.GetEnumerator()) {
            git restore --source $entry.Value --staged --worktree -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $entry.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item release/windows (Join-Path $caseDir $entry.Key)
          }
      - name: Print from the real app in two paired orders
        shell: pwsh
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'windows-final-pdf'
          $env:WINDOWS_PUBLIC_QA_INVENTORY = Join-Path $caseDir 'inventory.json'
          $runs = @(
            @('control','AB'), @('final','AB'), @('final','BA'), @('control','BA')
          )
          foreach ($run in $runs) {
            $version,$pair = $run
            $env:WORD_STUDIO_EXECUTABLE = Join-Path $caseDir "$version/Word Studio/Word Studio.exe"
            $env:WINDOWS_NATIVE_PDF_COPY = Join-Path $caseDir "$version-$pair.pdf"
            if ($version -eq 'control') { $env:WINDOWS_NATIVE_PDF_CLOSE_CONTROL = '1' }
            else { Remove-Item Env:WINDOWS_NATIVE_PDF_CLOSE_CONTROL -ErrorAction SilentlyContinue }
            Write-Host "WINDOWS_FINAL_PDF_ORDER $pair $version"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Report physical raster equality apart from speed
        shell: powershell
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'windows-final-pdf'
          scripts/windows-qa/compare-pdf-paint.ps1 -Control (Join-Path $caseDir 'control-AB.pdf') -Candidate (Join-Path $caseDir 'final-AB.pdf') -ExpectedPages $env:QA_PAGES -ReportOnly
