name: Windows regression QA
run-name: Verify just the two exact-grid DOCX files with Open XML SDK
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 12
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test -- tests/hwp-native-merged-grid-width.spec.ts -g 'source cell widths' --workers=1 --trace=off
      - name: SDK validate both emitted DOCX files
        shell: pwsh
        run: |
          $docs = @(Get-ChildItem test-results -Recurse -Filter 'textbox-save-native-grid-*.docx')
          if ($docs.Count -ne 2) { throw 'Expected two actual DOCX saves' }
          $subset = New-Item "$env:RUNNER_TEMP/grid-sdk-input" -ItemType Directory
          foreach ($doc in $docs) { Copy-Item -LiteralPath $doc.FullName -Destination $subset.FullName }
          dotnet run --project scripts/word-openxml-validator -- $subset.FullName 2 *> "$env:RUNNER_TEMP/merged-grid-sdk.log"
          $status = $LASTEXITCODE
          Write-Host "WINDOWS_GRID_SDK total $($docs.Count) exit $status"
          if ($status -ne 0) {
            $machine = Get-Content "$env:RUNNER_TEMP/merged-grid-sdk.log" | Where-Object { $_.StartsWith('{') } | ForEach-Object {
              $r = $_ | ConvertFrom-Json
              [ordered]@{errors=@($r.errors | ForEach-Object { $_.id }); openFailed=[bool]$r.failure}
            }
            Write-Host ('WINDOWS_GRID_SDK_FAILURE_CODES ' + (ConvertTo-Json -InputObject @($machine) -Compress))
          }
          exit $status
