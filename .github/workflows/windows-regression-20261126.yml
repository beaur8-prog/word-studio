name: Windows regression QA
run-name: Isolate the first rejected check in the Windows page-heading repair
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native:
    name: Windows page-head diagnosis
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium
      WINDOWS_QA_PAGE_HEAD_TRACE: '1'
      WINDOWS_NATIVE_SKIP_PRINT: '1'
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_AUTHORED_PAGE_HEAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Read the native conditions for a single HWPX diagnostic output
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-1 "$env:RUNNER_TEMP/head-diagnosis" --ids 04-language-plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/head-diagnosis/inventory.json"
          $env:WINDOWS_LATIN_WITNESS = "$env:RUNNER_TEMP/head-witness.json"
          npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off
          exit $LASTEXITCODE
