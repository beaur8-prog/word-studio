name: Windows regression QA
run-name: Word Studio Windows regression for c117be6 and 2ea9a74
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  validation:
    name: Windows / ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        group: [docx, desktop, hwp-terminal, hwpx-terminal, hwp-large, hwp-other-1, hwp-other-2, hwp-other-3]
    env:
      QA_GROUP: ${{ matrix.group }}
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Check out the verified source tree
        shell: pwsh
        run: |
          if ($env:QA_GROUP -eq 'docx') {
            git -c advice.detachedHead=false checkout --detach 'HEAD~2'
            $expected = '1e2beb37cb6b8ed45da839b3b1c512654c5913d9'
          } else {
            git -c advice.detachedHead=false checkout --detach 'HEAD~1'
            $expected = 'd151b00242f7930e4c14af5b9988aa5e7515fac3'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = git rev-parse 'HEAD^{tree}'
          if ($actual -ne $expected) { throw "Unexpected source tree $actual" }
          Write-Host "Verified source tree $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci
      - name: Run Windows Node regression
        if: matrix.group == 'desktop'
        run: npm run test:native
      - name: Build on Windows
        if: matrix.group == 'desktop'
        run: npm run build
      - name: Exercise the Windows Electron app
        if: matrix.group == 'desktop'
        shell: pwsh
        run: |
          New-Item .cache -ItemType Directory -Force | Out-Null
          npm run test:desktop
      - name: Install pinned Playwright Chromium
        if: matrix.group != 'desktop'
        run: npx playwright install chromium
      - name: Run document regression tests
        if: matrix.group != 'desktop'
        shell: pwsh
        run: |
          $flags = @('--trace=off', '--reporter=line,json')
          switch -Regex ($env:QA_GROUP) {
            '^docx$' {
              $selected = @(
                'tests/docx-textboxes.spec.ts', 'tests/docx-grouped-pictures.spec.ts',
                'tests/docx-auto-hyphenation.spec.ts', 'tests/docx-outline-level.spec.ts',
                'tests/docx-checkboxes.spec.ts', 'tests/empty-heading-flow.spec.ts',
                'tests/word-furniture-empty-lines.spec.ts', 'tests/word-line-metrics.spec.ts',
                'tests/word-line-metrics-capacity.spec.ts', 'tests/word-wrapping-reference-density.spec.ts',
                'tests/word-normal-spacing-save.spec.ts', 'tests/word-page-bottom-spacing.spec.ts',
                'tests/word-row-split-defaults.spec.ts', 'tests/word-table-autofit.spec.ts',
                'tests/word-widow-splits.spec.ts', 'tests/paragraph-contextual-spacing.spec.ts',
                'tests/word-list-lines.spec.ts'
              )
            }
            '^(hwp|hwpx)-terminal$' {
              $selected = @('tests/hwp-cell-terminal.spec.ts')
              $flags += @('--grep', ("\b" + $Matches[1] + " "))
            }
            '^hwp-large$' {
              $selected = @('tests/hwp-editing.spec.ts')
            }
            '^hwp-other-([123])$' {
              $shard = $Matches[1]
              $selected = @(
                Get-ChildItem tests -Filter 'hwp*.spec.ts' | Sort-Object Name |
                  Where-Object { $_.Name -notin @('hwp-cell-terminal.spec.ts', 'hwp-editing.spec.ts') } |
                  ForEach-Object { "tests/$($_.Name)" }
              )
              $selected += @('tests/paragraph-contextual-spacing.spec.ts', 'tests/word-list-lines.spec.ts', 'tests/word-table-autofit.spec.ts')
              $flags += "--shard=$shard/3"
            }
            default { throw "Unexpected test group $env:QA_GROUP" }
          }
          $env:PLAYWRIGHT_JSON_OUTPUT_FILE = Join-Path $env:RUNNER_TEMP "$env:QA_GROUP.json"
          & node node_modules/@playwright/test/cli.js test @selected @flags
          $status = $LASTEXITCODE
          if (Test-Path $env:PLAYWRIGHT_JSON_OUTPUT_FILE) {
            $stats = (Get-Content $env:PLAYWRIGHT_JSON_OUTPUT_FILE -Raw | ConvertFrom-Json).stats
            if ($null -eq $stats -or ($stats.expected + $stats.unexpected + $stats.flaky) -eq 0) { throw 'No tests executed' }
            $line = "Windows QA $env:QA_GROUP | expected $($stats.expected) | unexpected $($stats.unexpected) | skipped $($stats.skipped) | flaky $($stats.flaky)"
            Write-Host $line
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line
          } elseif ($status -eq 0) {
            throw 'Missing Playwright result'
          }
          exit $status
