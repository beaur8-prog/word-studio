name: Windows regression QA
run-name: Windows cumulative native PDF and exact Hangul preparation comparison
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native:
    name: Windows native / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 44
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: hwp-2, id: 02-work-rules, control: 78df75786b1aa6766a6c8362cc2e2eee46de5b79 }
          - { group: public-2, id: moel-harassment-manual, control: 78df75786b1aa6766a6c8362cc2e2eee46de5b79 }
          - { group: hwp-1, id: 04-language-plan, control: 2e6f20c635c9f842722617da38167c563bda5dfc }
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      CONTROL: ${{ matrix.control }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build both product trees on the same runner
        shell: pwsh
        run: |
          npm run package:win:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item release/windows "$env:RUNNER_TEMP/paired-candidate"
          git restore --source $env:CONTROL -- src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $env:CONTROL -- src electron vendor package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:win:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item release/windows "$env:RUNNER_TEMP/paired-control"
      - name: Exercise both native save paths on the byte-pinned input
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/paired-input" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/paired-input/inventory.json"
          $inputCount = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($inputCount -ne 1) { throw 'Pinned input missing' }
          if ($env:QA_ID -eq '04-language-plan') {
            $env:WINDOWS_NATIVE_HWP_SAVES = '1'
            $env:WINDOWS_NATIVE_HWP_FORMATS = 'hwpx'
            $env:WINDOWS_NATIVE_HWP_TRACE = '1'
          }
          $status = @{}
          foreach ($variant in @('control','candidate')) {
            Write-Host "WINDOWS_PAIRED_PRODUCT $variant"
            $env:WORD_STUDIO_EXECUTABLE = "$env:RUNNER_TEMP/paired-$variant/Word Studio/Word Studio.exe"
            $env:WINDOWS_NATIVE_HWP_COMPARISON = "$env:RUNNER_TEMP/paired-$variant-shapes.txt"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            $status[$variant] = $LASTEXITCODE
            Write-Host "WINDOWS_PAIRED_EXIT $variant $LASTEXITCODE"
          }
          if ($status['candidate'] -ne 0) { exit $status['candidate'] }
          if ($status['control'] -ne 0) { exit $status['control'] }
          if ($env:QA_ID -eq '04-language-plan') {
            $before = Get-Content "$env:RUNNER_TEMP/paired-control-shapes.txt" -Raw
            $after = Get-Content "$env:RUNNER_TEMP/paired-candidate-shapes.txt" -Raw
            $exact = $before -eq $after
            Write-Host "WINDOWS_NATIVE_HANGUL_READBACK_EXACT $exact"
            if (-not $exact) { exit 1 }
          }
