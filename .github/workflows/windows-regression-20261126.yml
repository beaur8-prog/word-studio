name: Windows regression QA
run-name: Windows consecutive native HWP and HWPX saves with renderer profiling
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 32
    env:
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_FORMATS: 'hwp,hwpx'
      WINDOWS_NATIVE_HWP_TRACE: '1'
      WINDOWS_NATIVE_HWP_PROFILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run build -- --sourcemap
      - run: node scripts/package-win.cjs
      - name: Record real save and recovery timing for both formats
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-1 "$env:RUNNER_TEMP/native-hangul" --ids 04-language-plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/native-hangul/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          node scripts/windows-qa/native-export-pdf-stages.cjs
          exit $LASTEXITCODE
