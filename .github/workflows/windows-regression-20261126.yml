name: Windows regression QA
run-name: Windows missing Word face and unaffected Hancom reverse corpus
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  word-witness:
    runs-on: windows-latest
    timeout-minutes: 24
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Compare installed variants on the same original
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py word "$env:RUNNER_TEMP/word-fonts" --ids 02-tables
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/word-fonts/inventory.json"
          npm run test -- tests/windows-qa/word-fallback-witness.spec.ts --workers=1 --trace=off
          exit $LASTEXITCODE
  hwp-reverse:
    name: Windows reverse corpus / ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [hwp-1, hwp-2, hwp-3]
    env:
      QA_GROUP: ${{ matrix.group }}
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Reopen actual HWP and HWPX after the shared column change
        shell: pwsh
        run: |
          $manifest = Get-Content scripts/windows-qa/public-sources.json -Raw | ConvertFrom-Json
          $offset = [int]($env:QA_GROUP.Split('-')[1]) - 1
          $ids = @()
          for ($i = $offset; $i -lt $manifest.hwp.Count; $i += 3) {
            if ($manifest.hwp[$i].id -ne '08-math-exam') { $ids += $manifest.hwp[$i].id }
          }
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/reverse-corpus" --ids ($ids -join ',')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/reverse-corpus/inventory.json"
          $inputData = Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json
          if (@($inputData | Where-Object verified).Count -ne $ids.Count) { throw 'One of the fixed inputs was not available' }
          npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off
          exit $LASTEXITCODE
