name: Windows regression QA
run-name: Windows isolate startup failure in VML document test
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  vml-witness:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4288c66580e7090426c74c890f6b1fc8cc31ecac
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Recheck the failed VML test on the same product and capture startup status
        shell: pwsh
        run: |
          @'

          test.afterEach(async ({ page }, info) => {
            if (info.status === info.expectedStatus || page.isClosed()) return;
            const startup = await page.evaluate(() => ({
              inputs: document.querySelectorAll('input[type=file]').length,
              editors: document.querySelectorAll('.tiptap').length,
              overlays: document.querySelectorAll('vite-error-overlay').length,
              scripts: [...document.querySelectorAll('script[src]')].length,
              ready: document.readyState
            })).catch(() => ({ unavailable: true }));
            console.log('WINDOWS_VML_STARTUP ' + JSON.stringify(startup));
          });
          '@ | Add-Content tests/official-sample-regressions.spec.ts
          npm run test -- tests/official-sample-regressions.spec.ts --grep 'VML image dimensions' --repeat-each=3 --workers=1 --trace=off
          exit $LASTEXITCODE
