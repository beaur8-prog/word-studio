name: Windows regression QA
run-name: Check the deterministic mixed-font proof fixture on Windows and Linux
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  story-assets:
    name: Portable mixed-font line and actual ink / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Check exact line and column placement
        shell: pwsh
        run: |
          @'
          import { registerHooks } from 'node:module';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          const limits = pathToFileURL(resolve('electron/document-limits.json')).href;
          registerHooks({
            load(url, context, next) {
              if (url === limits && !context.importAttributes?.type)
                return next(url, { ...context, importAttributes: { ...context.importAttributes, type: 'json' } });
              return next(url, context);
            },
          });
          '@ | Set-Content -Encoding utf8 ci-document-limits.mjs
          $env:NODE_OPTIONS='--import=./ci-document-limits.mjs'
          npm run test -- tests/word-font-fallbacks.spec.ts tests/hwp-column-terminal.spec.ts tests/hwp-body-terminal-ink.spec.ts --workers=1 --trace=off
          exit $LASTEXITCODE
