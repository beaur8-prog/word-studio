name: Windows regression QA
run-name: Measure Windows cooperative Hancom export and review with exact readback
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native:
    name: Windows HWPX responsiveness / ${{ matrix.order }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        order: [control-first, candidate-first]
    env:
      QA_ORDER: ${{ matrix.order }}
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_FORMATS: hwpx
      WINDOWS_NATIVE_HWP_TRACE: '1'
      WINDOWS_NATIVE_HWP_PROFILE: '1'
      WINDOWS_NATIVE_LARGE_HANGUL: '1'
      WINDOWS_NATIVE_PICTURE_PAINT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Prepare the source-pinned large file and start the native export
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/large-native" --ids 02-work-rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/large-native/inventory.json"
          $versions = @{ control = 'd76d9df199b1ca2ff7e8bef4849b05fef84f2cce'; candidate = 'HEAD' }
          $sequence = if ($env:QA_ORDER -eq 'candidate-first') { @('candidate', 'control') } else { @('control', 'candidate') }
          foreach ($version in $sequence) {
            $product = $versions[$version]
            Write-Host "WINDOWS_LARGE_EXPORT_PRODUCT $version"
            git restore --source $product --staged --worktree -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $product -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build -- --sourcemap
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/package-win.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item release/windows "$env:RUNNER_TEMP/export-$version"
            $env:WORD_STUDIO_EXECUTABLE = "$env:RUNNER_TEMP/export-$version/Word Studio/Word Studio.exe"
            $env:WINDOWS_NATIVE_HWP_COMPARISON = "$env:RUNNER_TEMP/export-$version.sha"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $control = Get-Content "$env:RUNNER_TEMP/export-control.sha" -Raw
          $candidate = Get-Content "$env:RUNNER_TEMP/export-candidate.sha" -Raw
          if ($control -ne $candidate) { throw 'Native page info, text or control geometry changed' }
          Write-Host "WINDOWS_HWPX_LAYOUT_EXACT $env:QA_ORDER"
