name: Windows regression QA
run-name: Check the physical tables changed by the Hancom page-tail correction
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  table-owners:
    name: Windows Hancom table and glyph readback
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chromium
      WINDOWS_NATIVE_SKIP_PRINT: '1'
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_VERIFY_REVERSE_MEDIA: '1'
      WINDOWS_REQUIRE_REOPEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Compare body and cell payload after two actual DOCX saves
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py hwp-3 "$env:RUNNER_TEMP/native-table-audit" --ids 06-mixed-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/native-table-audit/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $versions = [ordered]@{control='0bf5bb6052ab0de96bc38ba3e8d011770fcb00d2';candidate='f355f3795f3dba0c7253a3b3163d051f1e53525a'}
          $nativeFolders = @{}
          foreach ($version in $versions.GetEnumerator()) {
            git restore --source $version.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $version.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $output = "$env:RUNNER_TEMP/table-owners-$($version.Key)"
            npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $saved = @(Get-ChildItem $output -Recurse -Filter 'hancom-saved.hwp')
            if ($saved.Count -ne 1) { throw 'Expected exactly one saved HWP' }
            $nativeFolders[$version.Key] = $saved[0].DirectoryName
          }
          node scripts/windows-qa/compare-hancom-table-owners.cjs $nativeFolders.control $nativeFolders.candidate
          exit $LASTEXITCODE
