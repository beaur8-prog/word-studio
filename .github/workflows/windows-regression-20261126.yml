name: Windows regression QA
run-name: Separate measuring and file creation on the variable 97-page Windows PDF route
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  profile-97:
    name: Native Windows PDF profile / 97 pages
    runs-on: windows-latest
    timeout-minutes: 37
    env:
      WINDOWS_EXPECT_NATIVE_PDF_PAGES: '97'
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_PRINT_PROFILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build final source with local source maps for attribution
        shell: pwsh
        run: |
          if ((git rev-parse 'HEAD:src') -ne '7dce0645084f50855723dd2bfbe44460dddc3570') { throw 'Unexpected product tree' }
          npm run build -- --sourcemap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-win.cjs
          exit $LASTEXITCODE
      - name: Profile three independent app launches on one runner
        shell: pwsh
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'native-97-print-profile'
          python scripts/windows-qa/fetch-public-inputs.py public-2 $caseDir --ids moel-harassment-manual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = Join-Path $caseDir 'inventory.json'
          $inventory = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          for ($sample = 1; $sample -le 3; $sample++) {
            Write-Host "WINDOWS_97_PRINT_PROFILE $sample"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
