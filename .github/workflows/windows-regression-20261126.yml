name: Windows regression QA
run-name: Verify the original Hancom page head and repeat fixed-cell reuse in reverse order
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  originals:
    name: Windows generated boundary / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: hwp-1, id: 04-language-plan }
    env:
      PLAYWRIGHT_CHANNEL: chromium
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_VERIFY_REVERSE_MEDIA: '1'
      WINDOWS_REQUIRE_REOPEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Measure actual HWP and HWPX body positions
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/geometry" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/geometry/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $variants = @('0bf5bb6052ab0de96bc38ba3e8d011770fcb00d2','HEAD')
          $env:WINDOWS_AUTHORED_PAGE_HEAD = '1'
          $env:WINDOWS_NATIVE_EXPORT_FLOW = '135,136,138,161'
          foreach ($variant in $variants) {
            Write-Host "WINDOWS_NATIVE_LINE_PRODUCT $variant"
            git restore --source $variant -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $variant -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:WINDOWS_LATIN_WITNESS = "$env:RUNNER_TEMP/lines-$variant.json"
            $output = "test-results-$variant"
            npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off --output $output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $docs = @(Get-ChildItem $output -Recurse -Filter 'textbox-save-*.docx')
            if ($docs.Count -ne 2) { throw 'Expected two actual DOCX saves' }
            dotnet run --project scripts/word-openxml-validator -- $output 2 *> "$env:RUNNER_TEMP/geometry-sdk-$variant.log"
            $status = $LASTEXITCODE
            Write-Host "WINDOWS_PUBLIC_SDK $variant total $($docs.Count) exit $status"
            if ($status -ne 0) { exit $status }
          }
          $old = @(Get-Content "$env:RUNNER_TEMP/lines-$($variants[0]).json" -Raw | ConvertFrom-Json)
          $new = @(Get-Content "$env:RUNNER_TEMP/lines-$($variants[-1]).json" -Raw | ConvertFrom-Json)
          if ($old.Count -ne 2 -or $new.Count -ne 2) { throw 'Expected both Hancom formats' }
          foreach ($index in 0,1) {
            $control=$old[$index]; $candidate=$new[$index]
            Write-Host "WINDOWS_NATIVE_PAGE_HEAD $($candidate.format) pages $($control.pages) to $($candidate.pages); head body $($control.pageHead.output[1].page) to $($candidate.pageHead.output[1].page)"
            if ($candidate.format -ne $control.format -or $candidate.pages -ge $control.pages -or
                -not $candidate.pageHead.matches -or $candidate.lines -ne $control.lines) {
              throw 'The original page head was not restored or an earlier witness changed'
            }
          }
  pixel:
    name: Windows PDF pixels / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: hwp-2, id: 02-work-rules, pages: 163}
          - {group: public-2, id: moel-harassment-manual, pages: 97}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      QA_PAGES: ${{ matrix.pages }}
      WINDOWS_NATIVE_PRINT_PROFILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build and print the same pinned case from both product trees
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/pdf-paint" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/pdf-paint/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $versions = [ordered]@{
            candidate = '81158268ca8007085b85db5374b1644cde6aa5c7'
            control = '0bf5bb6052ab0de96bc38ba3e8d011770fcb00d2'
          }
          foreach ($item in $versions.GetEnumerator()) {
            Write-Host "WINDOWS_PDF_PIXEL_PRODUCT $($item.Key)"
            git restore --source $item.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $item.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build -- --sourcemap
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/package-win.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item release/windows "$env:RUNNER_TEMP/pdf-app-$($item.Key)"
            $env:WORD_STUDIO_EXECUTABLE = "$env:RUNNER_TEMP/pdf-app-$($item.Key)/Word Studio/Word Studio.exe"
            $env:WINDOWS_NATIVE_PDF_COPY = "$env:RUNNER_TEMP/$($item.Key)-paint.pdf"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compare the decoded pixels with the Windows PDF renderer
        shell: powershell
        run: |
          scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/control-paint.pdf" -Candidate "$env:RUNNER_TEMP/candidate-paint.pdf" -ExpectedPages $env:QA_PAGES
  focused:
    name: Combined layout contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - name: Run focused layout contracts
        shell: pwsh
        run: |
          @'
          import { registerHooks } from 'node:module';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          const limits = pathToFileURL(resolve('electron/document-limits.json')).href;
          registerHooks({
            load(url, context, next) {
              if (url === limits && !context.importAttributes?.type)
                return next(url, { ...context, importAttributes: { ...context.importAttributes, type: 'json' } });
              return next(url, context);
            },
          });
          '@ | Set-Content -Encoding utf8 ci-document-limits.mjs
          $env:NODE_OPTIONS = '--import=./ci-document-limits.mjs'
          npm run test -- tests/hwp-native-page-head.spec.ts --workers=1 --trace=off
          exit $LASTEXITCODE
