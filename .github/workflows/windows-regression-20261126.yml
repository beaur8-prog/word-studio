name: Windows regression QA
run-name: Locate the remaining Windows print density differences in two line boxes
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  line-box:
    runs-on: windows-latest
    timeout-minutes: 22
    env:
      WINDOWS_DIAGNOSE_WORD_LINE_BOXES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Measure actual source line and tab geometry at two Windows monitor scales
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py word "$env:RUNNER_TEMP/word-line-box" --ids '02-tables,06-long-body'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/word-line-box/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 2) { throw 'A pinned input is unavailable' }
          $env:WORD_STUDIO_EXECUTABLE = "$((Get-Location).Path)/release/windows/Word Studio/Word Studio.exe"
          foreach ($scale in @('1','1.25')) {
            $env:WINDOWS_FORCE_DEVICE_SCALE = $scale
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
