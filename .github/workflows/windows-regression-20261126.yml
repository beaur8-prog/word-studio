name: Windows regression QA
run-name: Validate Windows desktop and packaged Word and Hangul at the verified product tree
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  desktop:
    name: Windows desktop / ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      QA_GROUP: ${{ matrix.group }}
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run one disjoint shard of the complete desktop suite
        shell: pwsh
        run: |
          @'
          import { registerHooks } from 'node:module';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          const limits = pathToFileURL(resolve('electron/document-limits.json')).href;
          registerHooks({
            load(url, context, next) {
              if (url === limits && !context.importAttributes?.type)
                return next(url, { ...context, importAttributes: { ...context.importAttributes, type: 'json' } });
              return next(url, context);
            },
          });
          '@ | Set-Content -Encoding utf8 ci-document-limits.mjs
          $env:NODE_OPTIONS='--import=./ci-document-limits.mjs'
          $env:PLAYWRIGHT_JSON_OUTPUT_FILE=Join-Path $env:RUNNER_TEMP 'windows-full.json'
          $files = @(Get-ChildItem tests -Recurse -Filter '*.spec.ts' | Sort-Object FullName |
            Where-Object { $_.Name -notlike 'android-*' -and $_.Directory.Name -ne 'windows-qa' } |
            ForEach-Object { (Resolve-Path -Relative $_.FullName).Replace('\','/') -replace '^\./','' })
          node node_modules/@playwright/test/cli.js test @files "--shard=$env:QA_GROUP/8" --workers=1 --reporter=line,json --trace=off
          $status = $LASTEXITCODE
          if (-not (Test-Path $env:PLAYWRIGHT_JSON_OUTPUT_FILE)) { exit 1 }
          $stats = (Get-Content $env:PLAYWRIGHT_JSON_OUTPUT_FILE -Raw | ConvertFrom-Json).stats
          if (($stats.expected + $stats.unexpected + $stats.flaky) -eq 0) { throw 'No tests executed' }
          Write-Host "WINDOWS_FULL group $env:QA_GROUP passed $($stats.expected) failed $($stats.unexpected) skipped $($stats.skipped) flaky $($stats.flaky)"
          exit $status

  native-word:
    name: Packaged Windows Word originals and actual DOCX round trips
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Run ten fixed Word originals in the real Windows app
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py word "$env:RUNNER_TEMP/docx-lang"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/docx-lang/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          $env:WINDOWS_NATIVE_DOCX_DIR = "$env:RUNNER_TEMP/word-docx"
          $env:WINDOWS_NATIVE_DOCX_AFTER_PRINT = '1'
          node scripts/windows-qa/native-export-pdf-stages.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/word-openxml-validator -- $env:WINDOWS_NATIVE_DOCX_DIR 20 *> "$env:RUNNER_TEMP/word-sdk.log"
          $status = $LASTEXITCODE
          Write-Host "WINDOWS_FINAL_SDK Word count 20 exit $status"
          exit $status

  native-hwp:
    name: Packaged Windows Hangul / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: hwp-1, id: 04-language-plan, pages: '42,43'}
          - {group: hwp-3, id: 06-mixed-document, pages: '39,42'}
          - {group: hwp-2, id: 08-math-exam, pages: '20,20'}
          - {group: hwp-3, id: 09-korean-exam, pages: '20,16'}
          - {group: hwp-1, id: 10-lh-plan, pages: '10,10'}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_EXPECT_NATIVE_PAGES: ${{ matrix.pages }}
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_REVIEW_MS: '540000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Run the file-menu export and reopen both native outputs
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/final-native" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/final-native/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          $env:WINDOWS_NATIVE_DOCX_DIR = "$env:RUNNER_TEMP/native-docx"
          node scripts/windows-qa/native-export-pdf-stages.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/word-openxml-validator -- $env:WINDOWS_NATIVE_DOCX_DIR 2 *> "$env:RUNNER_TEMP/native-sdk.log"
          $status = $LASTEXITCODE
          Write-Host "WINDOWS_FINAL_SDK Hangul $($env:QA_ID) count 2 exit $status"
          exit $status
