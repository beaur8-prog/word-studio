name: Windows regression QA
run-name: Check real Windows app launch with Unicode DOCX, HWP and HWPX shell paths
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  shell-open:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Launch the actual packaged app with quoted Unicode and relative paths
        shell: pwsh
        run: |
          if ((git rev-parse 'HEAD:src') -ne 'e037a5cdd5c175540e0f515031329fd4346dfd30') { throw 'Unexpected product source' }
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          node scripts/windows-qa/native-unicode-shell-open.cjs
          exit $LASTEXITCODE
