name: Windows regression QA
run-name: Measure physical Hangul print invariance across three Windows display scales
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  hangul-density:
    name: Packaged Hangul display density / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: hwp-2, id: 05-return-form}
          - {group: hwp-1, id: 07-english-exam}
          - {group: hwp-2, id: 08-math-exam}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Print at actual 100, 125 and 150 percent native display scale
        shell: pwsh
        run: |
          if ((git rev-parse 'HEAD:src') -ne 'e037a5cdd5c175540e0f515031329fd4346dfd30') { throw 'Unexpected baseline product source' }
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/hangul-density" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/hangul-density/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          foreach ($density in @('1','1.25','1.5')) {
            $env:WINDOWS_FORCE_DEVICE_SCALE = $density
            $env:WINDOWS_NATIVE_PRINT_GEOMETRY = "$env:RUNNER_TEMP/hwp-geometry-$density.json"
            $env:WINDOWS_NATIVE_PDF_COPY = "$env:RUNNER_TEMP/hwp-paper-$density.pdf"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($density in @('1.25','1.5')) {
            node scripts/windows-qa/compare-print-geometry.cjs "$env:RUNNER_TEMP/hwp-geometry-1.json" "$env:RUNNER_TEMP/hwp-geometry-$density.json" "$env:QA_ID-$density"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compare physical PDF rasters when the page counts match
        shell: powershell
        run: |
          $expectedPages = @(Get-Content "$env:RUNNER_TEMP/hwp-geometry-1.json" -Raw | ConvertFrom-Json).Count
          foreach ($density in @('1.25','1.5')) {
            $outputPages = @(Get-Content "$env:RUNNER_TEMP/hwp-geometry-$density.json" -Raw | ConvertFrom-Json).Count
            Write-Host "WINDOWS_HANGUL_DENSITY PDF $env:QA_ID $density pages $expectedPages $outputPages"
            if ($expectedPages -eq $outputPages) {
              scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/hwp-paper-1.pdf" -Candidate "$env:RUNNER_TEMP/hwp-paper-$density.pdf" -ExpectedPages $expectedPages -ReportOnly -MeasureDelta
            }
          }
