name: Windows regression QA
run-name: Measure the minimal inter-word rounding change in Windows Word print
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  display:
    name: Windows Word paragraph line boundaries
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_WORD_WRAP_WIDTH: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Measure logical line starts and glyph bands in the Windows print flow
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py word "$env:RUNNER_TEMP/word-breaks" --ids 06-long-body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/word-breaks/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $control = 'aebb99a5342bf59ee439dfc2f5ac5fed8dc6e3c6'
          git restore --source $control --staged --worktree -- src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $control -- src electron vendor package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:win:dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          foreach ($scale in @('1.25','1.5')) {
            $env:WINDOWS_FORCE_DEVICE_SCALE = $scale
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
