name: Windows regression QA
run-name: Measure the first residual shifted right column in the Windows HWPX diagnosis
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native-first-page-diagnostic:
    name: Windows native margin scope / ${{ matrix.format }}
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        format: [hwpx]
    env:
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_FORMATS: ${{ matrix.format }}
      WINDOWS_NATIVE_HWP_REVIEW_MS: '540000'
      WINDOWS_HWP_FIRST_PAGE_SOURCE_TRIAL: '1'
      WINDOWS_HWP_FIRST_PAGE_EXPAND: '1'
      WINDOWS_HWP_FIRST_PAGE_INCLUDE_LONG: '1'
      WINDOWS_HWP_FIRST_PAGE_PROJECT_FWSPACE: '1'
      WINDOWS_HWP_FIRST_PAGE_TRACE_LANES: '1'
      WINDOWS_HWP_TRACE_SHIFTED_RIGHT: '1'
      WINDOWS_CHECK_NATIVE_NBSPACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Measure the actual saved file and in-memory variations
        shell: pwsh
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'native-first-page'
          python scripts/windows-qa/fetch-public-inputs.py hwp-1 $caseDir --ids 07-english-exam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = Join-Path $caseDir 'inventory.json'
          $inventory = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          if ((git rev-parse 'HEAD:src') -ne '7dce0645084f50855723dd2bfbe44460dddc3570') { throw 'Unexpected product tree' }
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          node scripts/windows-qa/native-export-pdf-stages.cjs
          exit $LASTEXITCODE
