name: Windows regression QA
run-name: Measure English exam line boundaries with a fixed paired denominator on Windows
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  print-lines:
    name: Actual English exam print lines / ${{ matrix.scale }}
    runs-on: windows-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        scale: ['1','1.25','1.5']
    env:
      WINDOWS_FORCE_DEVICE_SCALE: ${{ matrix.scale }}
      WINDOWS_CAPTURE_HWP_BODY_LINES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Compare fixed visible line breaks from the actual printed documents
        shell: pwsh
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'english-print-lines'
          python scripts/windows-qa/fetch-public-inputs.py hwp-1 $caseDir --ids 07-english-exam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = Join-Path $caseDir 'inventory.json'
          $inventory = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          $refs = [ordered]@{ control='27a35890240d7bbf47f06fd961682eb94f89fc3d'; final='c52784078cc2ab47e0864c96000a28e3006b0948' }
          foreach ($entry in $refs.GetEnumerator()) {
            git restore --source $entry.Value --staged --worktree -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $entry.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $bundle = Join-Path $caseDir $entry.Key
            Move-Item release/windows $bundle
            $env:WORD_STUDIO_EXECUTABLE = Join-Path $bundle 'Word Studio/Word Studio.exe'
            $env:WINDOWS_NATIVE_PRINT_GEOMETRY = Join-Path $caseDir "$($entry.Key)-print-geometry.json"
            $env:WINDOWS_HWP_LINE_VERDICT = Join-Path $caseDir "$($entry.Key)-lines.json"
            Write-Host "WINDOWS_PRINT_LINE_BUILD $($entry.Key)"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/windows-qa/compare-hwp-print-witness.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/windows-qa/pair-hwp-print-line-counts.cjs (Join-Path $caseDir 'control-lines.json') (Join-Path $caseDir 'final-lines.json')
          exit $LASTEXITCODE
