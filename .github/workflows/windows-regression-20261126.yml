name: Windows regression QA
run-name: Verify the original 19-glyph cell and one-sheet form on Windows native exports
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  originals:
    name: Windows generated boundary / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: hwp-2, id: 05-return-form }
    env:
      PLAYWRIGHT_CHANNEL: chromium
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_VERIFY_REVERSE_MEDIA: '1'
      WINDOWS_REQUIRE_REOPEN: '1'
      WINDOWS_NATIVE_SKIP_PRINT: '1'
      WINDOWS_DIAGNOSTIC_FORM_FLOW: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Measure actual HWP and HWPX body positions
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/geometry" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/geometry/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $env:WINDOWS_HANCOM_FIXED_AGREEMENT = '1'
          npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $docs = @(Get-ChildItem test-results -Recurse -Filter 'textbox-save-*.docx')
          if ($docs.Count -ne 2) { throw 'Expected two actual DOCX saves' }
          dotnet run --project scripts/word-openxml-validator -- test-results 2 *> "$env:RUNNER_TEMP/return-form-sdk.log"
          $status = $LASTEXITCODE
          Write-Host "WINDOWS_PUBLIC_SDK HEAD total $($docs.Count) exit $status"
          exit $status
