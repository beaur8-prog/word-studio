name: Windows regression QA
run-name: Windows pinned mixed-document table inset retry
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  original:
    name: Windows / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: hwp-3, id: 06-mixed-document }
    env:
      PLAYWRIGHT_CHANNEL: chromium
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_VERIFY_REVERSE_MEDIA: '1'
      WINDOWS_VERIFY_NATIVE_GEOMETRY: '1'
      WINDOWS_REQUIRE_REOPEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Verify the same pinned original on both source trees
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/table-insets" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/table-insets/inventory.json"
          $inputCount = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($inputCount -ne 1) { throw 'Pinned input missing' }
          if ($env:QA_ID -eq '08-math-exam') {
            $env:WINDOWS_REQUIRE_REVERSE='1'
            $env:WINDOWS_EXACT_REVERSE_PAGES='1'
          }
          foreach ($variant in @('fb6ef74e1ce9824e61198031285372a82577f908', 'HEAD')) {
            Write-Host "WINDOWS_TABLE_INSETS_PRODUCT $variant"
            git restore --source $variant -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $variant -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run test -- tests/windows-qa/public-originals.spec.ts --workers=1 --trace=off
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate two actual DOCX packages retaining source margins
        shell: pwsh
        run: |
          $outputs = @(Get-ChildItem test-results -Recurse -Filter 'textbox-save-*.docx')
          if ($outputs.Count -ne 2) { throw 'Expected two actual saves' }
          dotnet run --project scripts/word-openxml-validator -- test-results $outputs.Count *> "$env:RUNNER_TEMP/inline-margins-sdk.log"
          $status = $LASTEXITCODE
          Write-Host "WINDOWS_PUBLIC_SDK total $($outputs.Count) exit $status"
          exit $status
