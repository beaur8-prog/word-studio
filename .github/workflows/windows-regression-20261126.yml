name: Windows regression QA
run-name: Audit visible content on the large PDFs whose final exact raster changed
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  content-audit:
    name: Windows physical content audit / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: public-2, id: moel-harassment-manual}
          - {group: hwp-2, id: 02-work-rules}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      WINDOWS_FORCE_DEVICE_SCALE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Capture scalar content comparison from the browser tree that produced the actual PDF
        shell: pwsh
        run: |
          $caseDir = Join-Path $env:RUNNER_TEMP 'large-print-content'
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP $caseDir --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = Join-Path $caseDir 'inventory.json'
          $inventory = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json)
          if ($inventory.Count -ne 1 -or -not $inventory[0].verified) { throw 'One byte-pinned input is required' }
          $refs = [ordered]@{ control='19892d86e3599cbf2e735c40bdb23bd967242a5d'; final='c52784078cc2ab47e0864c96000a28e3006b0948' }
          foreach ($entry in $refs.GetEnumerator()) {
            git restore --source $entry.Value --staged --worktree -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $entry.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $package = Join-Path $caseDir $entry.Key
            Move-Item release/windows $package
            $env:WORD_STUDIO_EXECUTABLE = Join-Path $package 'Word Studio/Word Studio.exe'
            $env:WINDOWS_FIXED_PRINT_CONTENT_AUDIT = Join-Path $caseDir "$($entry.Key)-print-content.json"
            if ($entry.Key -eq 'control') { $env:WINDOWS_NATIVE_PDF_CLOSE_CONTROL = '1' }
            else { Remove-Item Env:WINDOWS_NATIVE_PDF_CLOSE_CONTROL -ErrorAction SilentlyContinue }
            Write-Host "WINDOWS_PRINT_CONTENT_BUILD $($entry.Key)"
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/windows-qa/fixed-print-content-audit.cjs (Join-Path $caseDir 'control-print-content.json') (Join-Path $caseDir 'final-print-content.json')
          exit $LASTEXITCODE
