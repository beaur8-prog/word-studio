name: Windows regression QA
run-name: Bisect the extra HWPX page in the actual Windows writer
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native-hwp:
    name: Packaged Windows binary tail / ${{ matrix.product }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        product: [control, before-style, after-style, candidate]
    env:
      QA_GROUP: hwp-1
      QA_ID: 10-lh-plan
      WINDOWS_MEASURE_PACKAGED_PAGE_BOUNDARIES: '1'
      WINDOWS_NATIVE_HWP_FORMATS: hwpx
      WINDOWS_PRODUCT: ${{ matrix.product }}
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_REVIEW_MS: '540000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build only the exact named source tree
        shell: pwsh
        run: |
          $sources = @{ control = '19892d86e3599cbf2e735c40bdb23bd967242a5d'; 'before-style' = '4288c66'; 'after-style' = '6b8fad0'; candidate = '18f295a132ed3aab3af75af47a89fd63031adf25' }
          $source = $sources[$env:WINDOWS_PRODUCT]
          git restore --source $source -- src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $source -- src electron vendor package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:win:dir
          exit $LASTEXITCODE
      - name: Run the file-menu export and reopen both native outputs
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/final-native" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/final-native/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          $env:WINDOWS_NATIVE_DOCX_DIR = "$env:RUNNER_TEMP/native-docx"
          node scripts/windows-qa/native-export-pdf-stages.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/word-openxml-validator -- $env:WINDOWS_NATIVE_DOCX_DIR 2 *> "$env:RUNNER_TEMP/native-sdk.log"
          $status = $LASTEXITCODE
          Write-Host "WINDOWS_FINAL_SDK Hangul $($env:QA_ID) count 2 exit $status"
          exit $status
