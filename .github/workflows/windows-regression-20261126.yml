name: Windows regression QA
run-name: Windows Electron first long-document layout change
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  desktop-comparison:
    name: Windows Electron / ${{ matrix.target.name }}
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: before-f9dbc4f
            commit: 1cea293ab14ed0a3d75ad3592410f9188aa68251
            tree: cceb5cbd8af634562519f3d73e401e72cac6c6f4
          - name: after-caa38f4
            commit: 0e86a5ea6d73d66e2cc588187656a248729ee20f
            tree: c4512a6dcc20b757adf086ac37cc19164f0dbfe1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.commit }}
          persist-credentials: false
      - name: Verify source tree
        shell: pwsh
        run: |
          $actual = git rev-parse 'HEAD^{tree}'
          if ($actual -ne '${{ matrix.target.tree }}') { throw "Unexpected source tree $actual" }
          Write-Host "Verified source tree $actual"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: node node_modules/vite/bin/vite.js build
      - name: Exercise the Windows Electron app and capture the synthetic metrics
        shell: pwsh
        run: |
          npm run test:desktop
          $status = $LASTEXITCODE
          $profiles = @(Get-ChildItem .cache -Directory -Filter 'desktop-smoke-*')
          foreach ($profile in $profiles) {
            $metricsPath = Join-Path $profile.FullName 'long-document-metrics.json'
            if (Test-Path $metricsPath) {
              $measure = Get-Content $metricsPath -Raw | ConvertFrom-Json
              $result = [ordered]@{
                initialPages = $measure.initialPages
                reopenedPages = $measure.reopenedPages
                originalMetrics = $measure.originalMetrics
                reopenedMetrics = $measure.reopenedMetrics
              }
              Write-Host ('Windows Electron synthetic metrics ' + ($result | ConvertTo-Json -Depth 9 -Compress))
            }
          }
          exit $status
