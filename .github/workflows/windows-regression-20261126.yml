name: Windows regression QA
run-name: Windows Studio native UI and PDF on byte-pinned public originals
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native-originals:
    name: Windows native originals / ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [word, hwp-1, hwp-2, hwp-3, public-1, public-2, public-3]
    env:
      QA_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged product tree
        shell: pwsh
        run: |
          git diff --exit-code 50f3e313ae55efcad876d2ef4350d224a2879e1e HEAD -- . ':!.github/workflows/windows-regression-20261126.yml' ':!scripts/windows-qa' ':!tests/windows-qa'
          exit $LASTEXITCODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run package:win:dir
      - name: Read and render published inputs in the packaged Windows app
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/public-qa-inputs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/public-qa-inputs/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = (Resolve-Path 'release/windows/Word Studio/Word Studio.exe').Path
          node scripts/windows-qa/native-public-originals.cjs
          exit $LASTEXITCODE
