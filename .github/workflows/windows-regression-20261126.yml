name: Windows regression QA
run-name: Verify both standalone drawings after native Windows export
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  native:
    name: Packaged Windows 163-page Hancom preservation
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      WINDOWS_FORCE_DEVICE_SCALE: '1'
      WINDOWS_NATIVE_HWP_SAVES: '1'
      WINDOWS_NATIVE_HWP_FORMATS: hwp,hwpx
      WINDOWS_NATIVE_LARGE_HANGUL: '1'
      WINDOWS_NATIVE_LARGE_TEXT: '1'
      WINDOWS_NATIVE_PICTURE_PAINT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Prepare the source-pinned large file and start the native export
        shell: pwsh
        run: |
          $product = 'HEAD'
          git restore --source $product --staged --worktree -- src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $product -- src electron vendor package.json package-lock.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build -- --sourcemap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-win.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/large-native" --ids 02-work-rules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/large-native/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = "$pwd/release/windows/Word Studio/Word Studio.exe"
          node scripts/windows-qa/native-export-pdf-stages.cjs
          exit $LASTEXITCODE

  focused:
    name: Inline native image regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npm run test -- tests/hwp-native-large-raster.spec.ts --workers=1 --trace=off
