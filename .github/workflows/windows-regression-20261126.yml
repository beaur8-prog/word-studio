name: Windows regression QA
run-name: Pair the exact DOCX cold reopen and native Windows PDF paint
on:
  push:
    branches: [codex/windows-layout-qa-20261126]
permissions:
  contents: read
jobs:
  pixel:
    name: Windows PDF pixels / ${{ matrix.id }}
    runs-on: windows-latest
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: hwp-2, id: 02-work-rules, pages: 163}
          - {group: public-2, id: moel-harassment-manual, pages: 97}
    env:
      QA_GROUP: ${{ matrix.group }}
      QA_ID: ${{ matrix.id }}
      QA_PAGES: ${{ matrix.pages }}
      WINDOWS_NATIVE_PRINT_PROFILE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build and print the same pinned case from both product trees
        shell: pwsh
        run: |
          python scripts/windows-qa/fetch-public-inputs.py $env:QA_GROUP "$env:RUNNER_TEMP/pdf-paint" --ids $env:QA_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/pdf-paint/inventory.json"
          $verified = @(Get-Content $env:WINDOWS_PUBLIC_QA_INVENTORY -Raw | ConvertFrom-Json | Where-Object verified).Count
          if ($verified -ne 1) { throw 'Pinned input missing' }
          $versions = [ordered]@{
            control = 'e350f7171eb65c6e6af11cd5166214b20a711ddc'
            candidate = 'HEAD'
          }
          foreach ($item in $versions.GetEnumerator()) {
            Write-Host "WINDOWS_PDF_PIXEL_PRODUCT $($item.Key)"
            git restore --source $item.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $item.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build -- --sourcemap
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/package-win.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item release/windows "$env:RUNNER_TEMP/pdf-app-$($item.Key)"
            $env:WORD_STUDIO_EXECUTABLE = "$env:RUNNER_TEMP/pdf-app-$($item.Key)/Word Studio/Word Studio.exe"
            $env:WINDOWS_NATIVE_PDF_COPY = "$env:RUNNER_TEMP/$($item.Key)-paint.pdf"
            if ($item.Key -eq 'control') { $env:WINDOWS_NATIVE_PDF_CLOSE_CONTROL = '1' }
            else { Remove-Item Env:WINDOWS_NATIVE_PDF_CLOSE_CONTROL -ErrorAction SilentlyContinue }
            node scripts/windows-qa/native-export-pdf-stages.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compare the decoded pixels with the Windows PDF renderer
        shell: powershell
        run: |
          scripts/windows-qa/compare-pdf-paint.ps1 -Control "$env:RUNNER_TEMP/control-paint.pdf" -Candidate "$env:RUNNER_TEMP/candidate-paint.pdf" -ExpectedPages $env:QA_PAGES
  cold-docx:
    name: Exact saved math DOCX / same Windows runner
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build both Windows apps and open the same file from a cold start
        shell: pwsh
        run: |
          $candidate = git rev-parse HEAD
          $versions = [ordered]@{ candidate = $candidate; control = 'e350f7171eb65c6e6af11cd5166214b20a711ddc' }
          foreach ($version in $versions.GetEnumerator()) {
            git restore --source $version.Value -- src
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code $version.Value -- src electron vendor package.json package-lock.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run package:win:dir
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item release/windows "$env:RUNNER_TEMP/reopen-$($version.Key)"
          }
          $candidateExe = "$env:RUNNER_TEMP/reopen-candidate/Word Studio/Word Studio.exe"
          $controlExe = "$env:RUNNER_TEMP/reopen-control/Word Studio/Word Studio.exe"
          python scripts/windows-qa/fetch-public-inputs.py hwp-2 "$env:RUNNER_TEMP/reopen-original" --ids 08-math-exam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WINDOWS_PUBLIC_QA_INVENTORY = "$env:RUNNER_TEMP/reopen-original/inventory.json"
          $env:WORD_STUDIO_EXECUTABLE = $candidateExe
          $env:WINDOWS_NATIVE_DOCX_DIR = "$env:RUNNER_TEMP/reopen-docx"
          $env:WINDOWS_NATIVE_DOCX_DIAGNOSE = '1'
          $env:WINDOWS_FORCE_DEVICE_SCALE = '1'
          node scripts/windows-qa/native-export-pdf-stages.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-qa/native-docx-cold-reopen.cjs $controlExe $candidateExe "$env:WINDOWS_NATIVE_DOCX_DIR/textbox-save-08-math-exam-native-1.docx"
          exit $LASTEXITCODE
