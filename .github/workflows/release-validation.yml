name: Release validation

on:
  push:
    branches:
      - 'codex/release-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:native
      - run: npm test -- --reporter=line
      - run: npm run package:win
      - name: Test Windows setup, installed application, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: word-studio-windows-release
          path: |
            release/installer/Word-Studio-*-windows-x64-setup.exe
            release/windows/BUILD-win-x64.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          include-hidden-files: true
          path: |
            .cache/desktop-smoke-*/result.json
            .cache/installer-test.json
            .cache/desktop-smoke-*/*.png
            .cache/desktop-smoke-*/*.pdf
            test-results/
