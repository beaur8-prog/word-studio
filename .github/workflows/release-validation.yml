name: Release validation

on:
  push:
    branches:
      - 'codex/release-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:native
      - run: npm test -- --reporter=line
      - run: npm run package:win
      - name: Test the Windows application
        shell: pwsh
        run: |
          $env:WORD_STUDIO_EXECUTABLE = Join-Path $pwd 'release/windows/Word Studio/Word Studio.exe'
          npm run test:desktop
          exit $LASTEXITCODE
      - name: Archive Windows application
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path 'release/windows/Word Studio' -DestinationPath "release/Word-Studio-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: word-studio-windows-release
          path: |
            release/Word-Studio-*-windows-x64.zip
            release/windows/BUILD-win-x64.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          include-hidden-files: true
          path: |
            .cache/desktop-smoke-*/result.json
            .cache/desktop-smoke-*/*.png
            .cache/desktop-smoke-*/*.pdf
            test-results/
