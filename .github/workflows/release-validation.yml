name: Release validation

on:
  push:
    branches:
      - 'codex/release-*'
  workflow_dispatch:
    inputs:
      native_only:
        description: 'Only packaging/native checks; use after unchanged renderer/browser checks pass'
        type: boolean
        default: false
      linux_only:
        description: 'Retry Linux checks after unchanged Windows application checks pass'
        type: boolean
        default: false
      windows_only:
        description: 'Only Windows checks after unchanged Linux package checks pass'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Linux desktop test dependencies
        timeout-minutes: 6
        run: bash scripts/prepare-linux-ci.sh browser
      - run: npm run test:native
      - run: npm run test:updates
      - run: npm test -- --reporter=line
        if: ${{ !inputs.native_only }}
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run package:linux
      - name: Test installed Debian package and data preservation
        run: xvfb-run -a npm run test:linux-package
      - uses: actions/upload-artifact@v4
        with:
          name: word-studio-linux-release
          path: |
            release/linux/Word-Studio-*-linux-x64.deb
            release/linux/BUILD-linux-x64.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-22-test-evidence
          include-hidden-files: true
          path: |
            .cache/linux-package-test.json
            .cache/hwp-native-*/result.json
            .cache/hwp-editing-native-*/result.json
            .cache/hwp-editing-native-*/*.png
            .cache/hwp-native-*/*.png
            .cache/hwp-native-*/*.pdf
            .cache/desktop-smoke-*/result.json
            .cache/desktop-smoke-*/*.png
            .cache/desktop-smoke-*/*.pdf
            test-results/
  linux-24:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Linux desktop test dependencies
        timeout-minutes: 6
        run: bash scripts/prepare-linux-ci.sh
      - uses: actions/download-artifact@v4
        with:
          name: word-studio-linux-release
          path: release/linux
      - name: Test the same Debian package on Ubuntu 24.04
        run: xvfb-run -a npm run test:linux-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-24-test-evidence
          include-hidden-files: true
          path: |
            .cache/linux-package-test.json
            .cache/hwp-native-*/result.json
            .cache/hwp-editing-native-*/result.json
            .cache/hwp-editing-native-*/*.png
            .cache/hwp-native-*/*.png
            .cache/hwp-native-*/*.pdf
            .cache/desktop-smoke-*/result.json
            .cache/desktop-smoke-*/*.png
            .cache/desktop-smoke-*/*.pdf
  windows:
    if: ${{ !inputs.linux_only }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:native
      - run: npm run test:updates
      - run: npm test -- --reporter=line
        if: ${{ !inputs.native_only }}
      - run: npm run package:win
      - name: Test Windows setup, installed application, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: word-studio-windows-release
          path: |
            release/installer/Word-Studio-*-windows-x64-setup.exe
            release/windows/BUILD-win-x64.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          include-hidden-files: true
          path: |
            .cache/desktop-smoke-*/result.json
            .cache/installer-test.json
            .cache/hwp-native-*/result.json
            .cache/hwp-editing-native-*/result.json
            .cache/hwp-editing-native-*/*.png
            .cache/hwp-native-*/*.png
            .cache/hwp-native-*/*.pdf
            .cache/desktop-smoke-*/*.png
            .cache/desktop-smoke-*/*.pdf
            test-results/
